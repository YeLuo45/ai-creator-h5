<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Creator - 分享</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #333;
      line-height: 1.6;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    
    .share-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      padding-top: 40px;
    }
    
    .share-header {
      text-align: center;
      color: #fff;
      margin-bottom: 24px;
    }
    
    .share-header h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .share-header p {
      font-size: 14px;
      opacity: 0.9;
    }
    
    /* Share Card */
    .share-card {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      margin-bottom: 24px;
    }
    
    .share-card-image {
      width: 100%;
      aspect-ratio: 1;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .share-card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .share-card-image.music {
      aspect-ratio: auto;
      height: 180px;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }
    
    .share-card-image.music img {
      height: 100%;
      object-fit: cover;
    }
    
    .share-card-image.tts {
      aspect-ratio: auto;
      padding: 40px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
    }
    
    .share-card-icon {
      font-size: 64px;
    }
    
    .share-card-content {
      padding: 16px;
    }
    
    .share-card-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    
    .share-card-prompt {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
      background: #f9f9f9;
      padding: 10px 12px;
      border-radius: 8px;
      word-break: break-all;
    }
    
    .share-card-meta {
      margin-top: 12px;
      font-size: 11px;
      color: #999;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    /* Share Channels */
    .share-channels {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    
    .share-channels-title {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 16px;
      text-align: center;
    }
    
    .share-channel-list {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    
    .share-channel-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 12px 8px;
      border-radius: 12px;
      transition: background 0.2s;
    }
    
    .share-channel-item:active {
      background: #f5f5f5;
    }
    
    .share-channel-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    
    .share-channel-icon.wechat {
      background: #07c160;
      color: #fff;
    }
    
    .share-channel-icon.twitter {
      background: #1da1f2;
      color: #fff;
    }
    
    .share-channel-icon.telegram {
      background: #0088cc;
      color: #fff;
    }
    
    .share-channel-icon.copy {
      background: #666;
      color: #fff;
    }
    
    .share-channel-name {
      font-size: 12px;
      color: #666;
    }
    
    /* Short URL Section */
    .short-url-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #f0f0f0;
    }
    
    .short-url-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 8px;
      text-align: center;
    }
    
    .short-url-box {
      display: flex;
      gap: 8px;
    }
    
    .short-url-input {
      flex: 1;
      padding: 10px 12px;
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 12px;
      color: #666;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .short-url-copy {
      padding: 10px 16px;
      background: #1A73E8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    
    /* Loading State */
    .loading-card {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      padding: 60px 40px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e0e0e0;
      border-top-color: #1A73E8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      color: #666;
      font-size: 14px;
    }
    
    /* Error State */
    .error-card {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      padding: 60px 40px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    
    .error-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    
    .error-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    
    .error-desc {
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
    }
    
    .error-btn {
      display: inline-block;
      padding: 10px 24px;
      background: #1A73E8;
      color: #fff;
      border-radius: 20px;
      text-decoration: none;
      font-size: 14px;
    }
    
    /* Toast */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      z-index: 9999;
      transition: transform 0.3s;
    }
    
    #toast.show {
      transform: translateX(-50%) translateY(0);
    }
    
    /* App Link */
    .app-link {
      margin-top: 24px;
      text-align: center;
    }
    
    .app-link a {
      color: #fff;
      font-size: 13px;
      text-decoration: none;
      opacity: 0.9;
    }
    
    .app-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="share-page">
    <div id="content"></div>
  </div>
  
  <div id="toast"></div>

  <script type="module">
    // 短链前缀
    const SHORT_PREFIX = 's/';
    
    // 解析URL参数
    function getQueryParam(key) {
      const params = new URLSearchParams(window.location.search);
      return params.get(key);
    }
    
    // 显示Toast
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    
    // 复制到剪贴板
    async function copyToClipboard(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
        document.body.appendChild(textarea);
        textarea.select();
        const success = document.execCommand('copy');
        document.body.removeChild(textarea);
        return success;
      } catch {
        return false;
      }
    }
    
    // 短链存储键
    const SHORT_URL_KEY = 'share_short_urls';
    
    // 获取短链数据
    function getShortUrlData(id) {
      try {
        const shortUrls = JSON.parse(localStorage.getItem(SHORT_URL_KEY) || '{}');
        const entry = shortUrls[id];
        if (entry) {
          // 增加点击
          entry.hits++;
          localStorage.setItem(SHORT_URL_KEY, JSON.stringify(shortUrls));
          return entry.data;
        }
      } catch {}
      return null;
    }
    
    // 默认分享数据
    function getDefaultData() {
      const type = getQueryParam('type') || 'image';
      const titles = {
        image: '🎨 AI 创作图片',
        music: '🎵 AI 创作音乐', 
        tts: '🎤 AI 语音合成'
      };
      return {
        type,
        title: titles[type] || '✨ AI Creator',
        prompt: '用 AI Creator 创作的精彩作品',
        url: '',
        timestamp: Date.now()
      };
    }
    
    // 加载分享数据
    function loadShareData() {
      const content = document.getElementById('content');
      
      // 检查是否有短链参数
      const query = window.location.search;
      let cardData = null;
      let shortCode = null;
      
      if (query.startsWith('?' + SHORT_PREFIX)) {
        shortCode = query.slice(SHORT_PREFIX.length + 1);
        cardData = getShortUrlData(shortCode);
      } else if (query.includes('=')) {
        // 尝试从URL参数获取
        const type = getQueryParam('type');
        const prompt = getQueryParam('prompt');
        const url = getQueryParam('url');
        const title = getQueryParam('title');
        
        if (type) {
          cardData = { type, prompt: prompt || '', url: url || '', title: title || '' };
        }
      }
      
      // 如果没有数据，显示默认
      if (!cardData) {
        cardData = getDefaultData();
      }
      
      renderSharePage(cardData);
    }
    
    // 渲染分享页面
    function renderSharePage(cardData) {
      const content = document.getElementById('content');
      const type = cardData.type || 'image';
      const shortUrl = `${window.location.origin}/pages/share.html?${SHORT_PREFIX}${shortCode || ''}`;
      
      let imageSection = '';
      if (type === 'image' && cardData.url) {
        imageSection = `<div class="share-card-image">
          <img src="${cardData.url}" alt="分享图片">
        </div>`;
      } else if (type === 'music' && cardData.url) {
        imageSection = `<div class="share-card-image music">
          <img src="${cardData.coverUrl || ''}" alt="音乐封面" onerror="this.style.display='none'">
        </div>`;
      } else if (type === 'tts') {
        imageSection = `<div class="share-card-image tts">
          <span class="share-card-icon">🎤</span>
        </div>`;
      } else {
        imageSection = `<div class="share-card-image">
          <span class="share-card-icon">${type === 'music' ? '🎵' : '🖼️'}</span>
        </div>`;
      }
      
      let musicMeta = '';
      if (type === 'music' && cardData.duration) {
        musicMeta = `<span>⏱️ ${cardData.duration}秒</span>`;
      }
      
      const date = new Date(cardData.timestamp || Date.now()).toLocaleDateString('zh-CN');
      
      content.innerHTML = `
        <div class="share-header">
          <h1>✨ AI Creator</h1>
          <p>分享你的创作</p>
        </div>
        
        <div class="share-card">
          ${imageSection}
          <div class="share-card-content">
            <div class="share-card-title">${cardData.title || 'AI 创作'}</div>
            ${cardData.prompt ? `<div class="share-card-prompt">"${cardData.prompt}"</div>` : ''}
            <div class="share-card-meta">
              <span>📅 ${date}</span>
              ${musicMeta}
            </div>
          </div>
        </div>
        
        <div class="share-channels">
          <div class="share-channels-title">分享到</div>
          <div class="share-channel-list">
            <div class="share-channel-item" onclick="shareToWechat()">
              <div class="share-channel-icon wechat">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="#fff">
                  <path d="M8.5 11a1.5 1.5 0 100-3 1.5 1.5 0 000 3zm5 0a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/>
                  <path d="M12 2C6.477 2 2 6.145 2 11.243c0 2.936 1.526 5.55 3.926 7.227l-.926 2.781 3.252-1.626A11.394 11.394 0 0012 20.486c5.523 0 10-4.145 10-9.243C22 6.145 17.523 2 12 2z"/>
                </svg>
              </div>
              <span class="share-channel-name">微信</span>
            </div>
            
            <div class="share-channel-item" onclick="shareToTwitter()">
              <div class="share-channel-icon twitter">𝕏</div>
              <span class="share-channel-name">Twitter</span>
            </div>
            
            <div class="share-channel-item" onclick="shareToTelegram()">
              <div class="share-channel-icon telegram">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="#fff">
                  <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.461-1.901-.903-1.056-.69-1.647-1.114-2.678-1.799-1.185-.78-2.647-1.506-4.015-1.901-2.218-.64-3.299-1.047-3.3-1.127-.003-.02.382-.527.532-.592.467-.206 1.511-.256 2.161-.155.955.145 6.071 4.153 6.578 4.463.083.05.374.153.746.009.598-.232.6-.232.672-.29.006-.002.014-.015.014-.015l-.027-.017s-.72-.3-2.148-1.108c-1.201-.68-2.015-1.03-2.277-1.083-.056-.01-.108-.016-.156-.016-.046.005-.156.063-.156.063l-.215-.135s-.77-.468-.914-.566c-.144-.099-.338-.14-.338-.14s-.014.021-.041.064c-.023.037-.067.118-.067.118l-.083.118s-.11.16-.126.188c-.015.027-.028.048-.05.073-.021.025-.044.05-.044.05s-.11.076-.26.144c-.147.067-.28.122-.28.122l-.026-.003s-.322.088-.794.207c-.473.119-.897.222-.897.222s-.054.018-.134.045c-.074.024-.175.055-.175.055s-.142.044-.329.108c-.186.063-1.213.551-1.346.647-.133.096-.273.193-.273.193s-.09.057-.086.28c.005.222.384 1.075 1.432 2.107 1.12 1.102 2.11 1.817 2.79 2.232.681.415 1.371.403 1.913.229.541-.175 1.347-.359 1.872-.438.525-.08 1.68-.164 2.473-.022.793.142 1.788.301 2.108.397.32.096.513.041.57.057.057.015.09.025.09.025s.045.012.054.022c.009.009.029.048.029.048s.054.078.118.145c.063.067.145.146.145.146s.075.066.186.156c.111.09.24.184.24.184s.085.064.194.138c.109.074.255.162.255.162s.147.09.317.188c.17.099.361.199.361.199s.154.07.344.147c.19.077.402.152.402.152s.177.064.41.136c.234.072.496.139.496.139s.24.053.548.104c.307.051.674.098.674.098.045 0 .091-.002.137-.005.046-.003.09-.009.134-.015l.003.002c.017-.006.034-.013.051-.02a1.8 1.8 0 00.086-.042l.003-.002s.17-.082.295-.153c.125-.072.262-.155.262-.155s.124-.07.288-.152c.164-.082.365-.177.365-.177s.17-.084.395-.184c.226-.099.495-.207.495-.207s.225-.099.534-.217c.309-.118.699-.251.699-.251s.253-.082.618-.177c.366-.095.83-.197 1.17-.245.34-.048.682-.065.943-.018.26.047.48.14.48.14s.172.076.244.118c.071.043.153.095.153.095s.117.072.25.144c.133.072.277.143.277.143s.134.065.289.126c.155.062.341.128.341.128s.158.058.346.112c.188.055.412.106.412.106s.197.043.447.076a12.2 12.2 0 00.894.073c.148.005.297.003.446-.002.15-.004.3-.012.448-.024.148-.012.297-.028.445-.046.148-.018.297-.04.444-.066.148-.025.295-.055.442-.088a12.3 12.3 0 00.874-.242c.138-.047.274-.098.41-.152.136-.054.27-.112.403-.174.133-.061.265-.126.394-.194.13-.068.257-.14.382-.217.126-.076.248-.156.368-.24.119-.083.236-.17.35-.26.114-.09.225-.185.332-.284.107-.099.211-.202.31-.309.1-.107.196-.218.288-.333.092-.115.179-.234.262-.357a7.4 7.4 0 00.23-.384c.07-.128.136-.26.197-.395.061-.135.118-.273.17-.414.052-.141.099-.285.141-.432.042-.146.079-.295.111-.446.032-.151.059-.304.081-.459a10.6 10.6 0 00.043-.936 9.9 9.9 0 00-.022-.466 9.1 9.1 0 00-.056-.46c-.024-.153-.054-.305-.088-.457a9.4 9.4 0 00-.124-.45 8.9 8.9 0 00-.157-.436 8.2 8.2 0 00-.19-.42 8.1 8.1 0 00-.223-.403 7.7 7.7 0 00-.252-.383 7.3 7.3 0 00-.28-.363 6.8 6.8 0 00-.307-.34 6.5 6.5 0 00-.332-.317 6.2 6.2 0 00-.357-.293 6 6 0 00-.38-.27 5.7 5.7 0 00-.4-.246 5.4 5.4 0 00-.42-.222 5.3 5.3 0 00-.44-.198 5.2 5.2 0 00-.456-.174 5.3 5.3 0 00-.472-.15 5.5 5.5 0 00-.485-.126 5.6 5.6 0 00-.497-.103 5.8 5.8 0 00-.508-.08 6 6 0 00-.517-.056c-.173-.01-.346-.012-.52-.01a6 6 0 00-.52.018c-.174.014-.346.035-.517.061a6.1 6.1 0 00-.513.09 6.3 6.3 0 00-.506.12z"/>
                </svg>
              </div>
              <span class="share-channel-name">Telegram</span>
            </div>
            
            <div class="share-channel-item" onclick="copyShareLink()">
              <div class="share-channel-icon copy">🔗</div>
              <span class="share-channel-name">复制链接</span>
            </div>
          </div>
          
          <div class="short-url-section">
            <div class="short-url-label">分享链接</div>
            <div class="short-url-box">
              <input type="text" class="short-url-input" id="shortUrlInput" value="${shortUrl}" readonly>
              <button class="short-url-copy" onclick="copyShortUrl()">复制</button>
            </div>
          </div>
        </div>
        
        <div class="app-link">
          <a href="${window.location.origin}/index.html">🚀 打开 AI Creator</a>
        </div>
      `;
    }
    
    // 分享到微信
    window.shareToWechat = function() {
      const url = document.getElementById('shortUrlInput').value;
      const text = `我用 AI Creator 创作了精彩内容，快来看看吧！\n\n${url}`;
      copyToClipboard(text).then(() => {
        showToast('分享内容已复制，请到微信粘贴');
      });
    };
    
    // 分享到 Twitter
    window.shareToTwitter = function() {
      const url = document.getElementById('shortUrlInput').value;
      const text = `Check out my AI creation! ✨`;
      const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`;
      window.open(twitterUrl, '_blank', 'width=550,height=420');
    };
    
    // 分享到 Telegram
    window.shareToTelegram = function() {
      const url = document.getElementById('shortUrlInput').value;
      const text = `我用 AI Creator 创作了精彩内容，快来看看吧！`;
      const telegramUrl = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;
      window.open(telegramUrl, '_blank', 'width=550,height=420');
    };
    
    // 复制分享链接
    window.copyShareLink = function() {
      const url = document.getElementById('shortUrlInput').value;
      copyToClipboard(url).then(success => {
        showToast(success ? '链接已复制' : '复制失败');
      });
    };
    
    // 复制短链接
    window.copyShortUrl = function() {
      const url = document.getElementById('shortUrlInput').value;
      copyToClipboard(url).then(success => {
        showToast(success ? '链接已复制' : '复制失败');
      });
    };
    
    // 页面加载时获取数据
    document.addEventListener('DOMContentLoaded', loadShareData);
  </script>
</body>
</html>
