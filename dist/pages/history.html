<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Creator - 历史</title>
  <style>
    .page {
      min-height: 100vh;
      background: #f5f5f5;
      padding-bottom: 80px;
    }

    /* Search Box */
    .search-section {
      background: #fff;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #f5f5f5;
      border-radius: 20px;
      padding: 8px 16px;
      gap: 8px;
    }

    .search-icon {
      font-size: 16px;
      color: #999;
    }

    .search-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      outline: none;
      color: #333;
    }

    .search-input::placeholder {
      color: #999;
    }

    .search-clear {
      font-size: 14px;
      color: #999;
      cursor: pointer;
      padding: 4px;
    }

    /* Search History */
    .search-history {
      background: #fff;
      padding: 8px 16px 12px;
      border-bottom: 1px solid #f0f0f0;
    }

    .search-history-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .search-history-title span {
      font-size: 12px;
      color: #999;
    }

    .search-history-title .clear-history {
      font-size: 12px;
      color: #1A73E8;
      cursor: pointer;
    }

    .search-history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .search-history-item {
      background: #f0f0f0;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      color: #666;
      cursor: pointer;
    }

    .search-history-item:active {
      background: #e0e0e0;
    }

    /* Filter Tags */
    .filter-section {
      background: #fff;
      padding: 8px 16px 12px;
      border-bottom: 1px solid #f0f0f0;
    }

    .filter-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-tag {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      color: #666;
      background: #f5f5f5;
      cursor: pointer;
      border: none;
    }

    .filter-tag:active {
      background: #e0e0e0;
    }

    .filter-tag.active {
      background: #1A73E8;
      color: #fff;
    }

    /* Tab Bar */
    .tab-bar-history {
      display: flex;
      background: #fff;
      padding: 0 16px;
      border-bottom: 1px solid #f0f0f0;
    }

    .tab-item-history {
      flex: 1;
      text-align: center;
      padding: 14px 0;
      font-size: 14px;
      color: #999;
      cursor: pointer;
      position: relative;
    }

    .tab-item-history.active {
      color: #1A73E8;
      font-weight: 600;
    }

    .tab-item-history.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 2px;
      background: #1A73E8;
      border-radius: 1px;
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px;
      gap: 8px;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-text {
      font-size: 16px;
      color: #333;
      font-weight: 500;
    }

    .empty-desc {
      font-size: 13px;
      color: #999;
      margin-bottom: 16px;
    }

    .btn-goto {
      padding: 10px 32px;
      background: #1A73E8;
      color: #fff;
      border-radius: 16px;
      font-size: 14px;
      border: none;
      cursor: pointer;
    }

    /* History List */
    .history-list {
      padding: 8px 16px;
    }

    .history-item {
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    .item-thumb {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      flex-shrink: 0;
      object-fit: cover;
    }

    .thumb-placeholder {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-size: 24px;
    }

    .item-info {
      flex: 1;
      overflow: hidden;
    }

    .item-prompt {
      font-size: 14px;
      color: #333;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 4px;
    }

    .item-meta {
      font-size: 11px;
      color: #999;
    }

    .btn-delete {
      font-size: 18px;
      padding: 8px;
      color: #ccc;
      cursor: pointer;
    }

    .btn-favorite {
      font-size: 16px;
      padding: 8px;
      color: #ccc;
      cursor: pointer;
    }

    .btn-favorite:active {
      color: #ffc107;
    }

    /* Bottom Actions */
    .bottom-actions {
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .btn-clear {
      padding: 10px 32px;
      background: #fff;
      color: #e53e3e;
      border: 1px solid #e53e3e;
      border-radius: 16px;
      font-size: 14px;
      cursor: pointer;
    }

    /* No Results */
    .no-results {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px;
      gap: 8px;
    }

    .no-results-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .no-results-text {
      font-size: 16px;
      color: #333;
      font-weight: 500;
    }

    .no-results-desc {
      font-size: 13px;
      color: #999;
    }

    /* Batch Selection */
    .batch-bar {
      display: none;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #f0f0f0;
      align-items: center;
      gap: 12px;
    }

    .batch-bar.visible {
      display: flex;
    }

    .batch-select-all {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #333;
      cursor: pointer;
    }

    .batch-count {
      flex: 1;
      font-size: 13px;
      color: #666;
    }

    .batch-actions-bar {
      display: none;
      position: fixed;
      bottom: 60px;
      left: 0;
      right: 0;
      background: #fff;
      padding: 12px 16px;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.1);
      z-index: 50;
      gap: 12px;
    }

    .batch-actions-bar.visible {
      display: flex;
    }

    .batch-btn {
      flex: 1;
      padding: 12px 0;
      border-radius: 8px;
      font-size: 14px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .batch-btn-download {
      background: #1A73E8;
      color: #fff;
    }

    .batch-btn-favorite {
      background: #ffc107;
      color: #333;
    }

    .batch-btn-delete {
      background: #fff;
      color: #e53e3e;
      border: 1px solid #e53e3e;
    }

    .checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid #ccc;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .checkbox.checked {
      background: #1A73E8;
      border-color: #1A73E8;
    }

    .checkbox::after {
      content: '✓';
      color: #fff;
      font-size: 12px;
      display: none;
    }

    .checkbox.checked::after {
      display: block;
    }

    .history-item.selected {
      background: #e8f0ff;
    }

    /* Progress for ZIP */
    .zip-progress {
      display: none;
      position: fixed;
      bottom: 80px;
      left: 16px;
      right: 16px;
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      z-index: 100;
    }

    .zip-progress.visible {
      display: block;
    }

    .zip-progress-bar {
      height: 6px;
      background: #f0f0f0;
      border-radius: 3px;
      overflow: hidden;
      margin: 8px 0;
    }

    .zip-progress-fill {
      height: 100%;
      background: linear-gradient(135deg, #1A73E8, #4facfe);
      transition: width 0.3s;
    }

    .zip-progress-text {
      font-size: 13px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- Search Section -->
    <div class="search-section">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索 Prompt、标题、描述" />
        <span class="search-clear" id="searchClear" style="display:none;">✕</span>
      </div>
    </div>

    <!-- Search History -->
    <div class="search-history" id="searchHistorySection" style="display:none;">
      <div class="search-history-title">
        <span>搜索历史</span>
        <span class="clear-history" onclick="clearSearchHistory()">清空</span>
      </div>
      <div class="search-history-list" id="searchHistoryList"></div>
    </div>

    <!-- Filter Tags -->
    <div class="filter-section" id="filterSection" style="display:none;">
      <div class="filter-tags">
        <button class="filter-tag active" data-filter="all" onclick="onFilterChange('all')">全部</button>
        <button class="filter-tag" data-filter="today" onclick="onFilterChange('today')">今天</button>
        <button class="filter-tag" data-filter="week" onclick="onFilterChange('week')">本周</button>
        <button class="filter-tag" data-filter="month" onclick="onFilterChange('month')">本月</button>
        <button class="filter-tag" data-filter="starred" onclick="onFilterChange('starred')">已收藏</button>
      </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar-history" id="tabBar">
      <div class="tab-item-history active" data-type="all" onclick="onTabChange('all')">全部</div>
      <div class="tab-item-history" data-type="image" onclick="onTabChange('image')">图片</div>
      <div class="tab-item-history" data-type="music" onclick="onTabChange('music')">音乐</div>
      <div class="tab-item-history" data-type="audio" onclick="onTabChange('audio')">语音</div>
    </div>

    <!-- Batch Selection Bar -->
    <div class="batch-bar" id="batchBar">
      <div class="batch-select-all" onclick="toggleSelectAll()">
        <div class="checkbox" id="selectAllCheckbox"></div>
        <span>全选</span>
      </div>
      <div class="batch-count" id="batchCount">已选择 0 项</div>
      <button class="btn-action" style="padding:6px 12px;font-size:12px;" onclick="cancelBatchMode()">取消</button>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state" style="display:none;">
      <span class="empty-icon">📭</span>
      <span class="empty-text">暂无历史记录</span>
      <span class="empty-desc">快去创作你的第一份作品吧</span>
      <button class="btn-goto" onclick="goToIndex()">去创作</button>
    </div>

    <!-- No Results -->
    <div id="noResults" class="no-results" style="display:none;">
      <span class="no-results-icon">🔍</span>
      <span class="no-results-text">未找到相关结果</span>
      <span class="no-results-desc">换个关键词试试吧</span>
    </div>

    <!-- History List -->
    <div id="historyList" class="history-list"></div>

    <!-- Clear All -->
    <div id="bottomActions" class="bottom-actions" style="display:none;">
      <button class="btn-clear" onclick="onClearAll()">清空全部历史</button>
    </div>

    <!-- Batch Actions Bar -->
    <div class="batch-actions-bar" id="batchActionsBar">
      <button class="batch-btn batch-btn-download" onclick="onBatchDownload()">📦 打包下载</button>
      <button class="batch-btn batch-btn-favorite" onclick="onBatchFavorite()">⭐ 收藏</button>
      <button class="batch-btn batch-btn-delete" onclick="onBatchDelete()">🗑️ 删除</button>
    </div>

    <!-- ZIP Progress -->
    <div class="zip-progress" id="zipProgress">
      <div class="zip-progress-text" id="zipProgressText">正在打包...</div>
      <div class="zip-progress-bar">
        <div class="zip-progress-fill" id="zipProgressFill" style="width:0%"></div>
      </div>
      <div class="zip-progress-text" id="zipProgressCount">0/0</div>
    </div>
  </div>

  <script>
    const SEARCH_HISTORY_KEY = 'search_history';
    const MAX_SEARCH_HISTORY = 5;

    let currentTab = 'all';
    let currentFilter = 'all';
    let searchKeyword = '';
    let allHistory = [];
    let searchDebounceTimer = null;

    window.pageInit = function() {
      loadHistory();
      initSearch();
    };

    function initSearch() {
      const searchInput = document.getElementById('searchInput');
      const searchClear = document.getElementById('searchClear');

      searchInput.addEventListener('input', function(e) {
        const value = e.target.value.trim();
        searchClear.style.display = value ? 'block' : 'none';
        debounceSearch();
      });

      searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          const value = e.target.value.trim();
          if (value) {
            saveSearchHistory(value);
          }
          performSearch(value);
        }
      });

      searchClear.addEventListener('click', function() {
        searchInput.value = '';
        searchClear.style.display = 'none';
        searchKeyword = '';
        performSearch('');
      });

      renderSearchHistory();
    }

    function debounceSearch() {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(function() {
        const value = document.getElementById('searchInput').value.trim();
        searchKeyword = value;
        performSearch(value);
      }, 300);
    }

    function performSearch(keyword) {
      renderList(getFilteredList());
    }

    function getFilteredList() {
      let list = allHistory;

      // Filter by tab type
      if (currentTab !== 'all') {
        const typeMap = { image: 'image', music: 'music', audio: 'audio' };
        list = list.filter(item => item.type === typeMap[currentTab]);
      }

      // Filter by time/starred
      if (currentFilter !== 'all') {
        const now = new Date();
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const weekStart = todayStart - (now.getDay() || 7) * 24 * 60 * 60 * 1000;
        const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();

        if (currentFilter === 'today') {
          list = list.filter(item => new Date(item.createdAt).getTime() >= todayStart);
        } else if (currentFilter === 'week') {
          list = list.filter(item => new Date(item.createdAt).getTime() >= weekStart);
        } else if (currentFilter === 'month') {
          list = list.filter(item => new Date(item.createdAt).getTime() >= monthStart);
        } else if (currentFilter === 'starred') {
          list = list.filter(item => item.starred === true);
        }
      }

      // Filter by search keyword
      if (searchKeyword) {
        const kw = searchKeyword.toLowerCase();
        list = list.filter(item => {
          const prompt = (item.prompt || item.input || '').toLowerCase();
          const title = (item.title || '').toLowerCase();
          const desc = (item.description || '').toLowerCase();
          return prompt.includes(kw) || title.includes(kw) || desc.includes(kw);
        });
      }

      return list;
    }

    function loadHistory() {
      allHistory = window.getAllHistory() || [];
      renderSearchHistory();
      filterHistory(currentTab);
    }

    function filterHistory(type) {
      currentTab = type;
      renderList(getFilteredList());
    }

    function onTabChange(type) {
      document.querySelectorAll('.tab-item-history').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.type === type);
      });
      filterHistory(type);
    }

    function onFilterChange(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tag').forEach(tag => {
        tag.classList.toggle('active', tag.dataset.filter === filter);
      });
      renderList(getFilteredList());
    }

    function renderList(list) {
      const emptyState = document.getElementById('emptyState');
      const noResults = document.getElementById('noResults');
      const historyList = document.getElementById('historyList');
      const bottomActions = document.getElementById('bottomActions');
      const filterSection = document.getElementById('filterSection');

      // Show filter section when searching or filtering
      const hasFilter = searchKeyword || currentFilter !== 'all';
      filterSection.style.display = hasFilter ? 'block' : 'none';

      if (allHistory.length === 0) {
        emptyState.style.display = 'flex';
        noResults.style.display = 'none';
        historyList.style.display = 'none';
        bottomActions.style.display = 'none';
        return;
      }

      if (list.length === 0) {
        emptyState.style.display = 'none';
        noResults.style.display = 'flex';
        historyList.style.display = 'none';
        bottomActions.style.display = 'none';
        return;
      }

      emptyState.style.display = 'none';
      noResults.style.display = 'none';
      historyList.style.display = 'block';
      bottomActions.style.display = allHistory.length > 0 ? 'flex' : 'none';

      const container = document.getElementById('historyList');
      container.innerHTML = list.map(item => {
        if (item.type === 'image') {
          return `
            <div class="history-item" data-id="${item.id}" data-url="${item.url}" onclick="onItemClick('${item.id}', 'image', this)">
              <div class="checkbox" onclick="event.stopPropagation(); toggleItemSelection('${item.id}')"></div>
              <img src="${item.url}" class="item-thumb">
              <div class="item-info">
                <span class="item-prompt">${item.prompt}</span>
                <span class="item-meta">图片 · ${new Date(item.createdAt).toLocaleDateString()}</span>
              </div>
              <span class="btn-favorite" onclick="event.stopPropagation(); onFavoriteItem('${item.id}', 'image', '${item.url}', '${encodeURIComponent(item.prompt || '')}')">⭐</span>
              <span class="btn-delete" onclick="event.stopPropagation(); onDelete('${item.id}', '${item.type}')">🗑️</span>
            </div>
          `;
        } else if (item.type === 'music') {
          return `
            <div class="history-item" data-id="${item.id}" data-url="${item.musicUrl}" onclick="onItemClick('${item.id}', 'music', this)">
              <div class="checkbox" onclick="event.stopPropagation(); toggleItemSelection('${item.id}')"></div>
              <div class="thumb-placeholder">🎵</div>
              <div class="item-info">
                <span class="item-prompt">${item.prompt}</span>
                <span class="item-meta">音乐 · ${item.duration}秒</span>
              </div>
              <span class="btn-favorite" onclick="event.stopPropagation(); onFavoriteItem('${item.id}', 'music', '${item.musicUrl}', '${encodeURIComponent(item.prompt || '')}')">⭐</span>
              <span class="btn-delete" onclick="event.stopPropagation(); onDelete('${item.id}', '${item.type}')">🗑️</span>
            </div>
          `;
        } else if (item.type === 'audio') {
          return `
            <div class="history-item" data-id="${item.id}" data-url="${item.filePath}" onclick="onItemClick('${item.id}', 'audio', this)">
              <div class="checkbox" onclick="event.stopPropagation(); toggleItemSelection('${item.id}')"></div>
              <div class="thumb-placeholder">🎤</div>
              <div class="item-info">
                <span class="item-prompt">${item.input}</span>
                <span class="item-meta">语音 · ${item.voiceName}</span>
              </div>
              <span class="btn-favorite" onclick="event.stopPropagation(); onFavoriteItem('${item.id}', 'tts', '${item.filePath}', '${encodeURIComponent(item.input || '')}')">⭐</span>
              <span class="btn-delete" onclick="event.stopPropagation(); onDelete('${item.id}', '${item.type}')">🗑️</span>
            </div>
          `;
        }
        return '';
      }).join('');
    }

    // Search History Functions
    function getSearchHistory() {
      const data = localStorage.getItem(SEARCH_HISTORY_KEY);
      return data ? JSON.parse(data) : [];
    }

    function saveSearchHistory(keyword) {
      let history = getSearchHistory();
      // Remove if exists
      history = history.filter(item => item !== keyword);
      // Add to front
      history.unshift(keyword);
      // Keep max 5
      if (history.length > MAX_SEARCH_HISTORY) {
        history = history.slice(0, MAX_SEARCH_HISTORY);
      }
      localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(history));
      renderSearchHistory();
    }

    function clearSearchHistory() {
      localStorage.removeItem(SEARCH_HISTORY_KEY);
      renderSearchHistory();
    }

    function renderSearchHistory() {
      const section = document.getElementById('searchHistorySection');
      const list = document.getElementById('searchHistoryList');
      const history = getSearchHistory();

      if (history.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'block';
      list.innerHTML = history.map(item =>
        `<span class="search-history-item" onclick="useSearchHistory('${item}')">${item}</span>`
      ).join('');
    }

    function useSearchHistory(keyword) {
      const searchInput = document.getElementById('searchInput');
      searchInput.value = keyword;
      document.getElementById('searchClear').style.display = 'block';
      searchKeyword = keyword;
      performSearch(keyword);
    }

    function playAudioItem(url) {
      window.playAudio(url);
    }

    function onMusicItem(url) {
      window.playAudio(url);
    }

    async function onDelete(id, type) {
      const res = await showModal({
        title: '确认删除',
        content: '删除后无法恢复',
        confirmColor: '#e53e3e',
        showCancel: true,
      });
      if (!res.confirm) return;

      const typeMap = { image: 'history_images', music: 'history_music', audio: 'history_tts' };
      const key = typeMap[type];
      const list = JSON.parse(localStorage.getItem(key) || '[]');
      const newList = list.filter(item => item.id !== id);
      localStorage.setItem(key, JSON.stringify(newList));
      loadHistory();
      showToast('已删除', 'success');
    }

    async function onClearAll() {
      const res = await showModal({
        title: '确认清空',
        content: '清空后无法恢复',
        confirmColor: '#e53e3e',
        showCancel: true,
      });
      if (!res.confirm) return;

      window.clearAllHistory();
      loadHistory();
      showToast('已清空', 'success');
    }

    async function onFavoriteItem(id, type, url, prompt) {
      const folders = window.FavoriteService.getFolders();
      if (folders.length === 0) {
        showToast('请先创建收藏夹', 'error');
        return;
      }

      let targetFolder = folders.find(f => f.type === type) || folders[0];
      const decodedPrompt = decodeURIComponent(prompt);

      const itemId = type + '_' + Date.now();
      window.FavoriteService.addToFolder(targetFolder.id, {
        itemId,
        type: type,
        url: url,
        prompt: decodedPrompt,
        cover: type === 'image' ? url : '',
        title: type === 'image' ? '图片收藏' : (type === 'music' ? '音乐收藏' : '语音收藏'),
      });

      showToast('已收藏到' + targetFolder.name, 'success');
    }

    function goToIndex() {
      window.location.hash = '/pages/index.html';
    }

    // Batch Selection State
    let batchMode = false;
    let selectedItems = new Set();

    function enterBatchMode() {
      batchMode = true;
      selectedItems.clear();
      document.getElementById('batchBar').classList.add('visible');
      document.getElementById('batchActionsBar').classList.add('visible');
      document.getElementById('bottomActions').style.display = 'none';
      // Add long press to enter batch mode
      document.body.style.overflow = 'hidden';
    }

    function cancelBatchMode() {
      batchMode = false;
      selectedItems.clear();
      document.getElementById('batchBar').classList.remove('visible');
      document.getElementById('batchActionsBar').classList.remove('visible');
      document.getElementById('bottomActions').style.display = allHistory.length > 0 ? 'flex' : 'none';
      document.body.style.overflow = '';
      updateHistoryItemsSelection();
    }

    function toggleSelectAll() {
      const filteredList = getFilteredList();
      if (selectedItems.size === filteredList.length) {
        selectedItems.clear();
      } else {
        filteredList.forEach(item => selectedItems.add(item.id));
      }
      updateSelectAllCheckbox();
      updateBatchCount();
      updateHistoryItemsSelection();
    }

    function updateSelectAllCheckbox() {
      const checkbox = document.getElementById('selectAllCheckbox');
      const filteredList = getFilteredList();
      if (selectedItems.size === filteredList.length && filteredList.length > 0) {
        checkbox.classList.add('checked');
      } else {
        checkbox.classList.remove('checked');
      }
    }

    function updateBatchCount() {
      document.getElementById('batchCount').textContent = '已选择 ' + selectedItems.size + ' 项';
    }

    function updateHistoryItemsSelection() {
      document.querySelectorAll('.history-item').forEach(el => {
        const id = el.dataset.id;
        if (selectedItems.has(id)) {
          el.classList.add('selected');
          el.querySelector('.checkbox')?.classList.add('checked');
        } else {
          el.classList.remove('selected');
          el.querySelector('.checkbox')?.classList.remove('checked');
        }
      });
    }

    function toggleItemSelection(id) {
      if (selectedItems.has(id)) {
        selectedItems.delete(id);
      } else {
        selectedItems.add(id);
      }
      updateSelectAllCheckbox();
      updateBatchCount();
      updateHistoryItemsSelection();
    }

    // Modify renderList to add checkbox and long press
    const originalRenderList = renderList;
    renderList = function(list) {
      originalRenderList(list);
      
      if (!batchMode) {
        // Add long press listener to enter batch mode
        document.querySelectorAll('.history-item').forEach(el => {
          el.removeEventListener('touchstart', handleLongPress);
          el.removeEventListener('mousedown', handleLongPress);
          el.addEventListener('touchstart', handleLongPress, { passive: true });
          el.addEventListener('mousedown', handleLongPress, { passive: true });
        });
      }
    };

    let longPressTimer = null;
    function handleLongPress(e) {
      if (batchMode) return;
      longPressTimer = setTimeout(() => {
        enterBatchMode();
        // Select the item that was long pressed
        const el = e.currentTarget;
        const id = el.dataset.id;
        if (id) {
          selectedItems.add(id);
          updateSelectAllCheckbox();
          updateBatchCount();
          updateHistoryItemsSelection();
        }
      }, 500);
    }

    document.addEventListener('touchend', () => clearTimeout(longPressTimer));
    document.addEventListener('touchcancel', () => clearTimeout(longPressTimer));
    document.addEventListener('mouseup', () => clearTimeout(longPressTimer));

    // Add click handler for checkbox
    function onItemClick(id, type, el) {
      if (batchMode) {
        toggleItemSelection(id);
      } else {
        // Normal click behavior
        if (type === 'image') {
          previewImage([el.dataset.url]);
        } else if (type === 'music') {
          onMusicItem(el.dataset.url);
        } else if (type === 'audio') {
          playAudioItem(el.dataset.url);
        }
      }
    }

    async function onBatchDownload() {
      if (selectedItems.size === 0) {
        showToast('请先选择项目', 'error');
        return;
      }
      
      const MAX_BATCH = 20;
      if (selectedItems.size > MAX_BATCH) {
        showToast('最多只能打包20个文件', 'error');
        return;
      }

      const zipProgress = document.getElementById('zipProgress');
      const zipProgressFill = document.getElementById('zipProgressFill');
      const zipProgressText = document.getElementById('zipProgressText');
      const zipProgressCount = document.getElementById('zipProgressCount');
      
      zipProgress.classList.add('visible');
      zipProgressText.textContent = '正在打包...';
      zipProgressFill.style.width = '0%';
      
      try {
        const zip = new JSZip();
        const filteredList = getFilteredList();
        const selectedList = filteredList.filter(item => selectedItems.has(item.id));
        let processed = 0;

        for (const item of selectedList) {
          try {
            let filename = '';
            let url = '';
            
            if (item.type === 'image') {
              filename = `image_${item.id || Date.now()}.png`;
              url = item.url;
            } else if (item.type === 'music') {
              filename = `music_${item.id || Date.now()}.mp3`;
              url = item.musicUrl;
            } else if (item.type === 'audio') {
              filename = `audio_${item.id || Date.now()}.mp3`;
              url = item.filePath;
            }

            // Sanitize filename
            filename = filename.replace(/[\\/:*?"<>|]/g, '_');
            
            if (url) {
              const response = await fetch(url);
              const blob = await response.blob();
              zip.file(filename, blob);
            }
          } catch (e) {
            console.warn('Failed to add item to zip:', item.id, e);
          }
          
          processed++;
          const percent = Math.round((processed / selectedList.length) * 100);
          zipProgressFill.style.width = percent + '%';
          zipProgressCount.textContent = `${processed}/${selectedList.length}`;
        }

        zipProgressText.textContent = '正在生成ZIP...';
        
        const content = await zip.generateAsync({ type: 'blob' }, (metadata) => {
          const percent = Math.round(metadata.percent);
          zipProgressFill.style.width = percent + '%';
        });

        // Download
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = `ai-creator-${Date.now()}.zip`;
        link.click();
        URL.revokeObjectURL(link.href);

        showToast('打包下载成功', 'success');
        cancelBatchMode();
      } catch (e) {
        console.error('ZIP error:', e);
        showToast('打包失败', 'error');
      } finally {
        zipProgress.classList.remove('visible');
      }
    }

    async function onBatchFavorite() {
      if (selectedItems.size === 0) {
        showToast('请先选择项目', 'error');
        return;
      }
      
      const folders = window.FavoriteService.getFolders();
      if (folders.length === 0) {
        showToast('请先创建收藏夹', 'error');
        return;
      }

      const filteredList = getFilteredList();
      const selectedList = filteredList.filter(item => selectedItems.has(item.id));
      let addedCount = 0;

      for (const item of selectedList) {
        const type = item.type === 'audio' ? 'tts' : item.type;
        let targetFolder = folders.find(f => f.type === type) || folders[0];
        
        const itemId = type + '_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        const url = item.type === 'image' ? item.url : (item.musicUrl || item.filePath);
        
        window.FavoriteService.addToFolder(targetFolder.id, {
          itemId,
          type: type,
          url: url,
          prompt: item.prompt || item.input || '',
          cover: item.type === 'image' ? item.url : '',
          title: item.type === 'image' ? '图片收藏' : (item.type === 'music' ? '音乐收藏' : '语音收藏'),
        });
        addedCount++;
      }

      showToast(`已收藏到 ${folders[0].name}`, 'success');
      cancelBatchMode();
    }

    async function onBatchDelete() {
      if (selectedItems.size === 0) {
        showToast('请先选择项目', 'error');
        return;
      }

      const res = await showModal({
        title: '确认删除',
        content: `确定要删除选中的 ${selectedItems.size} 个项目吗？`,
        confirmColor: '#e53e3e',
        showCancel: true,
      });
      
      if (!res.confirm) return;

      const filteredList = getFilteredList();
      const selectedList = filteredList.filter(item => selectedItems.has(item.id));

      for (const item of selectedList) {
        const typeMap = { image: 'history_images', music: 'history_music', audio: 'history_tts' };
        const key = typeMap[item.type];
        if (key) {
          const list = JSON.parse(localStorage.getItem(key) || '[]');
          const newList = list.filter(i => i.id !== item.id);
          localStorage.setItem(key, JSON.stringify(newList));
        }
      }

      showToast(`已删除 ${selectedList.length} 个项目`, 'success');
      cancelBatchMode();
      loadHistory();
    }

    window.addEventListener('hashchange', loadHistory);
  </script>
</body>
