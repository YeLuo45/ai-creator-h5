<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Creator - 分享作品</title>
  <link rel="stylesheet" href="../app.css">
  <style>
    .shared-page {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      padding-top: 40px;
      padding-bottom: 80px;
    }
    
    .shared-header {
      text-align: center;
      color: #fff;
      margin-bottom: 24px;
    }
    
    .shared-header h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .shared-header p {
      font-size: 14px;
      opacity: 0.9;
    }
    
    /* Work Card */
    .work-card {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      margin: 0 auto 20px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    
    .work-card-image {
      width: 100%;
      aspect-ratio: 1;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .work-card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .work-card-image.music {
      aspect-ratio: auto;
      height: 200px;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }
    
    .work-card-image.music img {
      height: 100%;
      object-fit: cover;
    }
    
    .work-card-image.tts {
      aspect-ratio: auto;
      padding: 40px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
    }
    
    .work-card-icon {
      font-size: 64px;
    }
    
    .work-card-content {
      padding: 16px;
    }
    
    .work-card-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    
    .work-card-prompt {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
      background: #f9f9f9;
      padding: 10px 12px;
      border-radius: 8px;
      word-break: break-all;
    }
    
    .work-card-meta {
      margin-top: 12px;
      font-size: 11px;
      color: #999;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .work-card-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    
    .work-action-btn {
      flex: 1;
      padding: 10px 0;
      background: #f0f4ff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      color: #1A73E8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    
    .work-action-btn:active {
      background: #dce5ff;
    }
    
    /* Comments Section */
    .comments-section {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      margin: 0 auto 20px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    
    .comments-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    
    .comments-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
    }
    
    .comments-count {
      font-size: 12px;
      color: #999;
    }
    
    .comments-list {
      max-height: 300px;
      overflow-y: auto;
    }
    
    .comment-item {
      display: flex;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .comment-item:last-child {
      border-bottom: none;
    }
    
    .comment-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #fff;
      flex-shrink: 0;
    }
    
    .comment-body {
      flex: 1;
      min-width: 0;
    }
    
    .comment-author {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 4px;
    }
    
    .comment-content {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
      word-break: break-all;
    }
    
    .comment-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
      font-size: 11px;
      color: #999;
    }
    
    .comment-like {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    
    .comment-like:active {
      color: #e53e3e;
    }
    
    .comment-time {
      font-size: 11px;
      color: #999;
    }
    
    /* Comment Form */
    .comment-form {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #f0f0f0;
    }
    
    .comment-input-wrapper {
      display: flex;
      gap: 8px;
    }
    
    .comment-input {
      flex: 1;
      padding: 10px 12px;
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      resize: none;
      min-height: 40px;
      max-height: 100px;
    }
    
    .comment-input:focus {
      outline: none;
      border-color: #1A73E8;
    }
    
    .comment-submit {
      padding: 10px 16px;
      background: #1A73E8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      align-self: flex-end;
    }
    
    .comment-submit:active {
      background: #1557b0;
    }
    
    /* Empty State */
    .comments-empty {
      text-align: center;
      padding: 30px 0;
      color: #999;
      font-size: 13px;
    }
    
    /* Loading State */
    .loading-card {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      padding: 60px 40px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e0e0e0;
      border-top-color: #1A73E8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      color: #666;
      font-size: 14px;
    }
    
    /* Error State */
    .error-card {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      padding: 60px 40px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    
    .error-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    
    .error-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    
    .error-desc {
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
    }
    
    .error-btn {
      display: inline-block;
      padding: 10px 24px;
      background: #1A73E8;
      color: #fff;
      border-radius: 20px;
      text-decoration: none;
      font-size: 14px;
    }
    
    /* Toast */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      z-index: 9999;
      transition: transform 0.3s;
    }
    
    #toast.show {
      transform: translateX(-50%) translateY(0);
    }
    
    /* App Link */
    .app-link {
      margin-top: 20px;
      text-align: center;
    }
    
    .app-link a {
      color: #fff;
      font-size: 13px;
      text-decoration: none;
      opacity: 0.9;
    }
    
    .app-link a:hover {
      text-decoration: underline;
    }
    
    /* Audio Player for Music/TTS */
    .audio-player {
      width: 100%;
      margin-top: 12px;
    }
    
    .audio-player audio {
      width: 100%;
      height: 40px;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div id="app" class="shared-page">
    <div id="content">
      <!-- Content loaded dynamically -->
    </div>
  </div>
  
  <audio id="ttsAudio" style="display:none;"></audio>
  <div id="toast"></div>

  <script type="module">
    // 加载协作服务
    import { CollabService } from '../services/collabService.js';
    
    // 解析URL参数
    function getQueryParam(key) {
      const params = new URLSearchParams(window.location.search);
      return params.get(key);
    }
    
    // 显示Toast
    function showToast(message, duration = 2000) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), duration);
    }
    
    // 格式化时间
    function formatTime(timestamp) {
      const now = Date.now();
      const diff = now - timestamp;
      const minutes = Math.floor(diff / 60000);
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);
      
      if (minutes < 1) return '刚刚';
      if (minutes < 60) return `${minutes}分钟前`;
      if (hours < 24) return `${hours}小时前`;
      if (days < 7) return `${days}天前`;
      return new Date(timestamp).toLocaleDateString('zh-CN');
    }
    
    // 获取默认作品数据
    function getDefaultWork() {
      const type = getQueryParam('type') || 'image';
      const titles = {
        image: '🎨 AI 创作图片',
        music: '🎵 AI 创作音乐', 
        tts: '🎤 AI 语音合成'
      };
      return {
        type,
        title: titles[type] || '✨ AI Creator',
        prompt: '用 AI Creator 创作的精彩作品',
        url: '',
        timestamp: Date.now()
      };
    }
    
    // 渲染分享页面
    function renderSharedPage(work, comments) {
      const content = document.getElementById('content');
      const type = work.type || 'image';
      
      let imageSection = '';
      if (type === 'image' && work.url) {
        imageSection = `<div class="work-card-image">
          <img src="${work.url}" alt="分享图片">
        </div>`;
      } else if (type === 'music' && work.url) {
        imageSection = `<div class="work-card-image music">
          ${work.coverUrl ? `<img src="${work.coverUrl}" alt="音乐封面" onerror="this.style.display='none'">` : ''}
        </div>`;
      } else if (type === 'tts') {
        imageSection = `<div class="work-card-image tts">
          <span class="work-card-icon">🎤</span>
        </div>`;
      } else {
        imageSection = `<div class="work-card-image">
          <span class="work-card-icon">${type === 'music' ? '🎵' : '🖼️'}</span>
        </div>`;
      }
      
      const date = new Date(work.createdAt || Date.now()).toLocaleDateString('zh-CN');
      
      // 渲染评论列表
      let commentsHtml = '';
      if (comments.length === 0) {
        commentsHtml = '<div class="comments-empty">还没有评论，快来抢沙发吧~</div>';
      } else {
        commentsHtml = comments.map(c => `
          <div class="comment-item" data-id="${c.id}">
            <div class="comment-avatar">${c.author.charAt(0)}</div>
            <div class="comment-body">
              <div class="comment-author">${escapeHtml(c.author)}</div>
              <div class="comment-content">${escapeHtml(c.content)}</div>
              <div class="comment-meta">
                <span class="comment-time">${formatTime(c.createdAt)}</span>
                <span class="comment-like" onclick="likeComment('${c.id}')">❤️ ${c.likes || 0}</span>
              </div>
            </div>
          </div>
        `).join('');
      }
      
      // 音频播放部分
      let audioSection = '';
      if ((type === 'music' || type === 'tts') && work.url) {
        audioSection = `<div class="audio-player">
          <audio id="workAudio" controls>
            <source src="${work.url}" type="audio/mpeg">
          </audio>
        </div>`;
      }
      
      content.innerHTML = `
        <div class="shared-header">
          <h1>✨ AI Creator</h1>
          <p>分享你的创作</p>
        </div>
        
        <div class="work-card">
          ${imageSection}
          <div class="work-card-content">
            <div class="work-card-title">${escapeHtml(work.title || 'AI 创作')}</div>
            <div class="work-card-prompt">"${escapeHtml(work.prompt || '')}"</div>
            ${audioSection}
            <div class="work-card-meta">
              <span>👁️ ${work.views || 0} 浏览</span>
              <span>❤️ ${work.likes || 0} 点赞</span>
              <span>📅 ${date}</span>
            </div>
            <div class="work-card-actions">
              <button class="work-action-btn" onclick="goToCreate()">✨ 我也要创作</button>
              <button class="work-action-btn" onclick="shareToWechat()">📱 分享</button>
            </div>
          </div>
        </div>
        
        <div class="comments-section">
          <div class="comments-header">
            <span class="comments-title">💬 评论</span>
            <span class="comments-count">${comments.length} 条评论</span>
          </div>
          <div class="comments-list" id="commentsList">
            ${commentsHtml}
          </div>
          <div class="comment-form">
            <div class="comment-input-wrapper">
              <textarea class="comment-input" id="commentInput" placeholder="写下你的评论..." rows="1"></textarea>
              <button class="comment-submit" onclick="submitComment()">发送</button>
            </div>
          </div>
        </div>
        
        <div class="app-link">
          <a href="../index.html">← 返回 AI Creator</a>
        </div>
      `;
      
      // 绑定评论输入框的自动高度
      const commentInput = document.getElementById('commentInput');
      if (commentInput) {
        commentInput.addEventListener('input', function() {
          this.style.height = 'auto';
          this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });
        
        // 回车提交（Shift+Enter换行）
        commentInput.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            submitComment();
          }
        });
      }
    }
    
    // HTML转义
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    // 提交评论
    function submitComment() {
      const input = document.getElementById('commentInput');
      if (!input) return;
      
      const content = input.value.trim();
      if (!content) {
        showToast('请输入评论内容');
        return;
      }
      
      const shareId = getQueryParam('shareId');
      if (!shareId) {
        showToast('无法获取分享ID');
        return;
      }
      
      // 添加评论
      const comment = CollabService.addComment(shareId, {
        author: '用户' + Math.floor(Math.random() * 10000),
        content: content
      });
      
      // 清空输入框
      input.value = '';
      input.style.height = 'auto';
      
      // 刷新评论列表
      loadComments(shareId);
      
      showToast('评论成功');
    }
    
    // 点赞评论
    function likeComment(commentId) {
      CollabService.likeComment(commentId);
      const shareId = getQueryParam('shareId');
      if (shareId) {
        loadComments(shareId);
      }
    }
    
    // 加载评论
    function loadComments(shareId) {
      const comments = CollabService.getComments(shareId);
      const commentsList = document.getElementById('commentsList');
      const commentsCount = document.querySelector('.comments-count');
      
      if (commentsList) {
        if (comments.length === 0) {
          commentsList.innerHTML = '<div class="comments-empty">还没有评论，快来抢沙发吧~</div>';
        } else {
          commentsList.innerHTML = comments.map(c => `
            <div class="comment-item" data-id="${c.id}">
              <div class="comment-avatar">${c.author.charAt(0)}</div>
              <div class="comment-body">
                <div class="comment-author">${escapeHtml(c.author)}</div>
                <div class="comment-content">${escapeHtml(c.content)}</div>
                <div class="comment-meta">
                  <span class="comment-time">${formatTime(c.createdAt)}</span>
                  <span class="comment-like" onclick="likeComment('${c.id}')">❤️ ${c.likes || 0}</span>
                </div>
              </div>
            </div>
          `).join('');
        }
      }
      
      if (commentsCount) {
        commentsCount.textContent = `${comments.length} 条评论`;
      }
    }
    
    // 返回创作页面
    function goToCreate() {
      window.location.href = '../index.html';
    }
    
    // 分享到微信（复制链接）
    function shareToWechat() {
      const url = window.location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => {
          showToast('链接已复制，请粘贴到微信分享');
        }).catch(() => {
          showToast('复制失败，请手动复制');
        });
      } else {
        showToast('链接已复制，请粘贴到微信分享');
      }
    }
    
    // 初始化页面
    function init() {
      const shareId = getQueryParam('shareId');
      const content = document.getElementById('content');
      
      if (!shareId) {
        // 没有shareId，显示默认内容
        const defaultWork = getDefaultWork();
        renderSharedPage(defaultWork, []);
        return;
      }
      
      // 尝试获取分享的作品
      const work = CollabService.getSharedWork(shareId);
      
      if (work) {
        // 显示作品和评论
        const comments = CollabService.getComments(shareId);
        renderSharedPage(work, comments);
        
        // 订阅实时更新
        CollabService.subscribeToUpdates((event) => {
          if (event.type === 'comment') {
            loadComments(shareId);
          }
        });
      } else {
        // 作品不存在，显示错误
        content.innerHTML = `
          <div class="shared-header">
            <h1>😢 作品不存在</h1>
            <p>可能已被删除或链接已失效</p>
          </div>
          <div class="error-card">
            <div class="error-icon">🔍</div>
            <div class="error-title">找不到该作品</div>
            <div class="error-desc">该分享链接可能已失效或作品已被删除</div>
            <a href="../index.html" class="error-btn">✨ 去创作</a>
          </div>
        `;
      }
    }
    
    // 启动
    init();
    
    // 暴露全局函数
    window.submitComment = submitComment;
    window.likeComment = likeComment;
    window.goToCreate = goToCreate;
    window.shareToWechat = shareToWechat;
  </script>
</body>
</html>
