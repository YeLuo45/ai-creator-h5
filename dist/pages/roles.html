<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Creator - 角色介绍</title>
  <style>
    .page {
      padding: 16px;
      min-height: 100vh;
      background: #f5f5f5;
      padding-bottom: 80px;
    }

    .page-header {
      text-align: center;
      padding: 24px 0 16px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .page-subtitle {
      font-size: 14px;
      color: #666;
    }

    .role-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 16px 0;
    }

    .role-card {
      background: #fff;
      border-radius: 16px;
      padding: 20px 16px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .role-card:active {
      transform: scale(0.98);
    }

    .role-card.selected {
      border: 2px solid #1A73E8;
      background: linear-gradient(135deg, #f0f4ff, #e8f0ff);
    }

    .role-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 12px;
    }

    .role-name {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .role-desc {
      font-size: 12px;
      color: #666;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .role-specialties {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .specialty-tag {
      padding: 4px 8px;
      background: #f0f4ff;
      color: #1A73E8;
      border-radius: 10px;
      font-size: 11px;
    }

    .role-detail-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .role-detail-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .role-detail-modal {
      background: #fff;
      border-radius: 20px;
      width: 90%;
      max-width: 340px;
      max-height: 80vh;
      overflow: hidden;
      transform: scale(0.9);
      transition: transform 0.3s;
    }

    .role-detail-overlay.active .role-detail-modal {
      transform: scale(1);
    }

    .role-detail-header {
      position: relative;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 24px;
      text-align: center;
      color: #fff;
    }

    .role-detail-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .role-detail-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 12px;
    }

    .role-detail-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .role-detail-desc {
      font-size: 13px;
      opacity: 0.9;
    }

    .role-detail-content {
      padding: 20px;
      overflow-y: auto;
      max-height: calc(80vh - 200px);
    }

    .detail-section {
      margin-bottom: 20px;
    }

    .detail-section:last-child {
      margin-bottom: 0;
    }

    .detail-label {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .detail-tag {
      padding: 6px 12px;
      background: #f0f4ff;
      color: #1A73E8;
      border-radius: 14px;
      font-size: 13px;
    }

    .detail-prompt-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 6px;
    }

    .detail-prompt {
      padding: 12px;
      background: #f9f9f9;
      border-radius: 10px;
      font-size: 12px;
      color: #666;
      line-height: 1.6;
      font-style: italic;
    }

    .btn-select-role {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1A73E8, #4facfe);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 16px;
    }

    .btn-select-role:active {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <div class="page-title">🤖 AI 角色中心</div>
      <div class="page-subtitle">选择专属AI角色，获得更专业的创作支持</div>
    </div>

    <div class="role-grid" id="roleGrid"></div>
  </div>

  <!-- Role Detail Modal -->
  <div class="role-detail-overlay" id="roleDetailOverlay" onclick="closeRoleDetail(event)">
    <div class="role-detail-modal" onclick="event.stopPropagation()">
      <div class="role-detail-header">
        <button class="role-detail-close" onclick="closeRoleDetail()">×</button>
        <div class="role-detail-avatar" id="detailAvatar"></div>
        <div class="role-detail-name" id="detailName"></div>
        <div class="role-detail-desc" id="detailDesc"></div>
      </div>
      <div class="role-detail-content">
        <div class="detail-section">
          <div class="detail-label">🎯 专长领域</div>
          <div class="detail-tags" id="detailSpecialties"></div>
        </div>
        <div class="detail-section">
          <div class="detail-label">💡 适用场景</div>
          <div class="detail-tags" id="detailScenes"></div>
        </div>
        <div class="detail-section">
          <div class="detail-prompt-label">角色 Prompt 前缀</div>
          <div class="detail-prompt" id="detailPrompt"></div>
        </div>
        <button class="btn-select-role" id="selectRoleBtn" onclick="selectThisRole()">
          选择此角色
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { getRoles, getRolePrompt, saveSelectedRole, getSelectedRole } from '../services/roleService.js';

    let currentRoleType = null;
    let selectedRoleType = getSelectedRole();

    function renderRoles() {
      const roles = getRoles();
      const grid = document.getElementById('roleGrid');
      
      grid.innerHTML = roles.map(role => `
        <div class="role-card ${selectedRoleType === role.type ? 'selected' : ''}" 
             onclick="showRoleDetail('${role.type}')">
          <div class="role-avatar">${role.icon}</div>
          <div class="role-name">${role.name}</div>
          <div class="role-desc">${role.description}</div>
          <div class="role-specialties">
            ${role.specialties.slice(0, 2).map(s => `<span class="specialty-tag">${s}</span>`).join('')}
          </div>
        </div>
      `).join('');
    }

    window.showRoleDetail = function(roleType) {
      const roles = getRoles();
      const role = roles.find(r => r.type === roleType);
      if (!role) return;

      currentRoleType = roleType;

      document.getElementById('detailAvatar').textContent = role.icon;
      document.getElementById('detailName').textContent = role.name;
      document.getElementById('detailDesc').textContent = role.description;
      
      document.getElementById('detailSpecialties').innerHTML = 
        role.specialties.map(s => `<span class="detail-tag">${s}</span>`).join('');
      
      document.getElementById('detailScenes').innerHTML = 
        role.适用场景.map(s => `<span class="detail-tag">${s}</span>`).join('');
      
      document.getElementById('detailPrompt').textContent = role.promptPrefix;
      
      const btn = document.getElementById('selectRoleBtn');
      if (selectedRoleType === roleType) {
        btn.textContent = '已选择 ✓';
        btn.disabled = true;
      } else {
        btn.textContent = '选择此角色';
        btn.disabled = false;
      }

      document.getElementById('roleDetailOverlay').classList.add('active');
    };

    window.closeRoleDetail = function(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('roleDetailOverlay').classList.remove('active');
    };

    window.selectThisRole = function() {
      if (currentRoleType) {
        saveSelectedRole(currentRoleType);
        selectedRoleType = currentRoleType;
        
        showToast('已选择 ' + getRoles().find(r => r.type === currentRoleType).name, 'success');
        closeRoleDetail();
        renderRoles();
        
        // Notify generate page if it exists
        if (window.opener || window.parent !== window) {
          window.postMessage({ type: 'roleSelected', roleType: currentRoleType }, '*');
        }
      }
    };

    // Render roles on load
    renderRoles();
  </script>
</body>
</html>
