<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Creator - 我的收藏</title>
  <style>
    .page {
      min-height: 100vh;
      background: #f5f5f5;
      padding-bottom: 80px;
    }

    .header {
      padding: 24px 16px 16px;
      background: linear-gradient(135deg, #1A73E8, #4facfe);
      color: #fff;
    }

    .header-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header-back {
      display: inline-block;
      margin-bottom: 12px;
      color: rgba(255,255,255,0.9);
      font-size: 14px;
      cursor: pointer;
    }

    /* Folder Grid */
    .folder-grid {
      padding: 12px 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .folder-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.06);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .folder-card:active {
      transform: scale(0.98);
    }

    .folder-cover {
      width: 100%;
      aspect-ratio: 1;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .folder-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .folder-cover-icon {
      font-size: 32px;
    }

    .folder-count {
      position: absolute;
      right: 8px;
      bottom: 8px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .folder-info {
      padding: 10px 12px;
    }

    .folder-name {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .folder-type {
      font-size: 11px;
      color: #999;
    }

    .folder-type-image { color: #667eea; }
    .folder-type-music { color: #f093fb; }
    .folder-type-tts { color: #4facfe; }
    .folder-type-mixed { color: #999; }

    /* Add Folder Button */
    .add-folder-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.06);
      cursor: pointer;
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 160px;
      border: 1px dashed #ddd;
    }

    .add-folder-card:active {
      transform: scale(0.98);
      background: #f9f9f9;
    }

    .add-icon {
      font-size: 32px;
      color: #ccc;
      margin-bottom: 8px;
    }

    .add-text {
      font-size: 13px;
      color: #999;
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px;
      gap: 8px;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-text {
      font-size: 16px;
      color: #333;
      font-weight: 500;
    }

    .empty-desc {
      font-size: 13px;
      color: #999;
    }

    /* Type Badge */
    .type-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 500;
    }

    .type-badge-image { background: rgba(102,126,234,0.15); color: #667eea; }
    .type-badge-music { background: rgba(240,147,251,0.15); color: #f093fb; }
    .type-badge-tts { background: rgba(79,172,254,0.15); color: #4facfe; }
    .type-badge-mixed { background: rgba(153,153,153,0.15); color: #999; }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <span class="header-back" onclick="goBack()">← 返回</span>
      <div class="header-title">我的收藏</div>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state" style="display:none;">
      <span class="empty-icon">📁</span>
      <span class="empty-text">暂无收藏夹</span>
      <span class="empty-desc">点击下方按钮创建第一个收藏夹</span>
    </div>

    <!-- Folder Grid -->
    <div id="folderGrid" class="folder-grid"></div>
  </div>

  <script>
    const typeIcons = {
      image: '🖼️',
      music: '🎵',
      tts: '🎤',
      mixed: '📁',
    };

    const typeLabels = {
      image: '图片',
      music: '音乐',
      tts: '语音',
      mixed: '混合',
    };

    window.pageInit = function() {
      // 确保有默认收藏夹
      window.FavoriteService.ensureDefaultFolders();
      loadFolders();
    };

    function loadFolders() {
      const folders = window.FavoriteService.getFolders();
      const grid = document.getElementById('folderGrid');
      const emptyState = document.getElementById('emptyState');

      if (folders.length === 0) {
        emptyState.style.display = 'flex';
        grid.style.display = 'none';
        return;
      }

      emptyState.style.display = 'none';
      grid.style.display = 'grid';

      grid.innerHTML = folders.map(folder => `
        <div class="folder-card" onclick="openFolder('${folder.id}')">
          <div class="folder-cover">
            ${folder.cover 
              ? `<img src="${folder.cover}" alt="${folder.name}">`
              : `<span class="folder-cover-icon">${typeIcons[folder.type] || '📁'}</span>`
            }
            <span class="folder-count">${folder.count}</span>
          </div>
          <div class="folder-info">
            <div class="folder-name">${folder.name}</div>
            <span class="type-badge type-badge-${folder.type}">${typeLabels[folder.type] || '混合'}</span>
          </div>
        </div>
      `).join('');
    }

    function openFolder(id) {
      window.location.hash = '/pages/folder.html?id=' + id;
    }

    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.hash = '/pages/index.html';
      }
    }

    window.addEventListener('hashchange', loadFolders);
  </script>
</body>
</html>
