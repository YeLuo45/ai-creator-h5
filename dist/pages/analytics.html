<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Creator - 数据分析</title>
  <style>
    .page {
      padding: 16px;
      padding-bottom: 80px;
      background: #f5f5f5;
      min-height: 100vh;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .page-title {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .page-back {
      font-size: 24px;
      color: #666;
      cursor: pointer;
      padding: 4px 8px;
    }

    /* Overview Cards */
    .overview-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .overview-card {
      background: #fff;
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    .overview-card-icon {
      font-size: 22px;
      margin-bottom: 6px;
    }

    .overview-card-value {
      font-size: 24px;
      font-weight: 700;
      color: #1A73E8;
      line-height: 1.2;
    }

    .overview-card-label {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }

    /* Chart Card */
    .chart-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .chart-title {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .chart-periods {
      display: flex;
      gap: 8px;
    }

    .period-btn {
      padding: 4px 10px;
      font-size: 12px;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      background: #fff;
      color: #666;
      cursor: pointer;
    }

    .period-btn.active {
      background: #1A73E8;
      color: #fff;
      border-color: #1A73E8;
    }

    /* Line Chart */
    .line-chart {
      position: relative;
      height: 160px;
      margin-top: 10px;
    }

    .line-chart-bars {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 120px;
      padding: 0 4px;
      border-bottom: 1px solid #e0e0e0;
      position: relative;
    }

    .line-chart-bar {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      max-width: 40px;
    }

    .line-chart-bar-fill {
      width: 24px;
      background: linear-gradient(180deg, #4facfe, #1A73E8);
      border-radius: 4px 4px 0 0;
      min-height: 4px;
      transition: height 0.3s ease;
    }

    .line-chart-bar-label {
      font-size: 10px;
      color: #999;
      margin-top: 6px;
    }

    .line-chart-value {
      font-size: 11px;
      font-weight: 600;
      color: #1A73E8;
      position: absolute;
      top: -18px;
    }

    /* Bar Chart */
    .bar-chart {
      margin-top: 10px;
    }

    .bar-item {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .bar-item:last-child {
      margin-bottom: 0;
    }

    .bar-label {
      width: 50px;
      font-size: 13px;
      color: #666;
      flex-shrink: 0;
    }

    .bar-track {
      flex: 1;
      height: 20px;
      background: #f0f0f0;
      border-radius: 10px;
      overflow: hidden;
      margin: 0 10px;
    }

    .bar-fill {
      height: 100%;
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding-left: 10px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      transition: width 0.5s ease;
    }

    .bar-fill.image { background: linear-gradient(90deg, #4facfe, #1A73E8); }
    .bar-fill.music { background: linear-gradient(90deg, #52c41a, #73d13d); }
    .bar-fill.tts { background: linear-gradient(90deg, #fa8c16, #ffc53d); }

    .bar-count {
      width: 45px;
      font-size: 13px;
      color: #666;
      text-align: right;
      flex-shrink: 0;
    }

    /* Heatmap */
    .heatmap-container {
      overflow-x: auto;
      margin-top: 10px;
    }

    .heatmap {
      display: grid;
      grid-template-columns: 50px repeat(24, 1fr);
      gap: 2px;
      min-width: 500px;
    }

    .heatmap-header {
      font-size: 10px;
      color: #999;
      text-align: center;
      padding: 4px 0;
    }

    .heatmap-day-label {
      font-size: 11px;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .heatmap-cell {
      height: 22px;
      border-radius: 4px;
      background: #f0f0f0;
      transition: background-color 0.2s;
      cursor: default;
    }

    .heatmap-cell:hover {
      transform: scale(1.1);
    }

    /* Heatmap Legend */
    .heatmap-legend {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 10px;
      font-size: 11px;
      color: #999;
    }

    .heatmap-legend-gradient {
      display: flex;
      gap: 2px;
    }

    .heatmap-legend-gradient span {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }

    /* Keywords List */
    .keywords-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .keyword-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #f0f4ff;
      border-radius: 16px;
      font-size: 13px;
      color: #1A73E8;
    }

    .keyword-tag-count {
      font-size: 11px;
      background: #1A73E8;
      color: #fff;
      padding: 2px 6px;
      border-radius: 10px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-state-text {
      font-size: 14px;
    }

    /* Loading */
    .loading-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #e0e0e0;
      border-top-color: #1A73E8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 40px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="page" id="analyticsPage">
    <div class="loading-spinner" id="loadingSpinner"></div>
  </div>

  <script>
    const DAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const TYPE_ICONS = { image: '🖼️', music: '🎵', tts: '🎤' };

    async function init() {
      const container = document.getElementById('analyticsPage');
      const loadingSpinner = document.getElementById('loadingSpinner');

      try {
        // Load analytics service
        await import('../services/analyticsService.js');

        const summary = await AnalyticsService.getDashboardSummary();

        loadingSpinner.style.display = 'none';

        if (summary.total === 0) {
          container.innerHTML = `
            <div class="page-header">
              <span class="page-back" onclick="history.back()">←</span>
              <span class="page-title">📊 数据分析</span>
            </div>
            <div class="empty-state">
              <div class="empty-state-icon">📊</div>
              <div class="empty-state-text">暂无创作数据<br>开始创作后即可查看分析</div>
            </div>
          `;
          return;
        }

        container.innerHTML = `
          <div class="page-header">
            <span class="page-back" onclick="history.back()">←</span>
            <span class="page-title">📊 数据分析</span>
          </div>

          <!-- Overview Cards -->
          <div class="overview-cards">
            <div class="overview-card">
              <div class="overview-card-icon">📝</div>
              <div class="overview-card-value">${summary.total}</div>
              <div class="overview-card-label">总创作数</div>
            </div>
            <div class="overview-card">
              <div class="overview-card-icon">📅</div>
              <div class="overview-card-value">${summary.weekCount}</div>
              <div class="overview-card-label">本周创作</div>
            </div>
            <div class="overview-card">
              <div class="overview-card-icon">🔥</div>
              <div class="overview-card-value">${summary.activeDays}</div>
              <div class="overview-card-label">活跃天数</div>
            </div>
          </div>

          <!-- Trend Chart -->
          <div class="chart-card">
            <div class="chart-header">
              <span class="chart-title">📈 创作趋势</span>
              <div class="chart-periods">
                <button class="period-btn active" data-period="day" onclick="changePeriod(this, 'day')">日</button>
                <button class="period-btn" data-period="week" onclick="changePeriod(this, 'week')">周</button>
                <button class="period-btn" data-period="month" onclick="changePeriod(this, 'month')">月</button>
              </div>
            </div>
            <div class="line-chart" id="trendChart"></div>
          </div>

          <!-- Type Distribution -->
          <div class="chart-card">
            <div class="chart-header">
              <span class="chart-title">📊 类型分布</span>
            </div>
            <div class="bar-chart" id="typeChart"></div>
          </div>

          <!-- Heatmap -->
          <div class="chart-card">
            <div class="chart-header">
              <span class="chart-title">🗓️ 活跃时段热力图</span>
            </div>
            <div class="heatmap-container">
              <div class="heatmap" id="heatmap"></div>
            </div>
            <div class="heatmap-legend">
              <span>低</span>
              <div class="heatmap-legend-gradient">
                <span style="background:#f0f0f0"></span>
                <span style="background:#c6e48b"></span>
                <span style="background:#7bc96f"></span>
                <span style="background:#239a3b"></span>
                <span style="background:#196127"></span>
              </div>
              <span>高</span>
            </div>
          </div>

          <!-- Keywords -->
          <div class="chart-card">
            <div class="chart-header">
              <span class="chart-title">🏷️ 高频关键词</span>
            </div>
            <div class="keywords-list" id="keywordsList"></div>
          </div>
        `;

        // Load charts
        await renderTrendChart('day');
        renderTypeChart(summary.typeDistribution);
        await renderHeatmap();
        await renderKeywords();

      } catch (e) {
        console.error('[Analytics] Init error:', e);
        loadingSpinner.style.display = 'none';
        container.innerHTML = `
          <div class="page-header">
            <span class="page-back" onclick="history.back()">←</span>
            <span class="page-title">📊 数据分析</span>
          </div>
          <div class="empty-state">
            <div class="empty-state-icon">❌</div>
            <div class="empty-state-text">加载失败，请重试</div>
          </div>
        `;
      }
    }

    async function changePeriod(btn, period) {
      document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      await renderTrendChart(period);
    }

    async function renderTrendChart(period) {
      const chartEl = document.getElementById('trendChart');
      const data = await AnalyticsService.getTrendData(period);

      if (!data || data.length === 0) {
        chartEl.innerHTML = '<div class="empty-state"><div class="empty-state-text">暂无趋势数据</div></div>';
        return;
      }

      const maxCount = Math.max(...data.map(d => d.count), 1);

      const barsHtml = data.map(d => {
        const height = d.count > 0 ? Math.max((d.count / maxCount) * 100, 10) : 4;
        return `
          <div class="line-chart-bar">
            <div class="line-chart-bar-fill" style="height:${height}%"></div>
            <span class="line-chart-bar-label">${d.label}</span>
          </div>
        `;
      }).join('');

      chartEl.innerHTML = `
        <div class="line-chart-bars" style="position:relative;">
          ${data.map((d, i) => `
            <div class="line-chart-bar" style="position:relative;">
              ${d.count > 0 ? `<span class="line-chart-value">${d.count}</span>` : ''}
              <div class="line-chart-bar-fill" style="height:${d.count > 0 ? (d.count / maxCount) * 100 : 4}%"></div>
              <span class="line-chart-bar-label">${d.label}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderTypeChart(distribution) {
      const chartEl = document.getElementById('typeChart');

      if (!distribution || distribution.length === 0) {
        chartEl.innerHTML = '<div class="empty-state"><div class="empty-state-text">暂无类型数据</div></div>';
        return;
      }

      const maxCount = Math.max(...distribution.map(d => d.count), 1);

      chartEl.innerHTML = distribution.map(d => {
        const width = (d.count / maxCount) * 100;
        return `
          <div class="bar-item">
            <span class="bar-label">${TYPE_ICONS[d.typeKey] || '📄'} ${d.type}</span>
            <div class="bar-track">
              <div class="bar-fill ${d.typeKey}" style="width:${width}%">${d.percent}%</div>
            </div>
            <span class="bar-count">${d.count}次</span>
          </div>
        `;
      }).join('');
    }

    async function renderHeatmap() {
      const heatmapEl = document.getElementById('heatmap');
      const { matrix, maxVal } = await AnalyticsService.getHourlyDistribution();

      if (!matrix || matrix.length === 0) {
        heatmapEl.innerHTML = '<div class="empty-state"><div class="empty-state-text">暂无热力数据</div></div>';
        return;
      }

      // Header row (hours)
      let html = '<div class="heatmap-header"></div>';
      for (let h = 0; h < 24; h++) {
        html += `<div class="heatmap-header">${h}</div>`;
      }

      // Day rows
      for (let d = 0; d < 7; d++) {
        html += `<div class="heatmap-day-label">${DAYS[d]}</div>`;
        for (let h = 0; h < 24; h++) {
          const val = matrix[d][h];
          const color = getHeatColor(val, maxVal);
          html += `<div class="heatmap-cell" style="background:${color}" title="${DAYS[d]} ${h}:00 - ${val}次创作"></div>`;
        }
      }

      heatmapEl.innerHTML = html;
    }

    function getHeatColor(value, max) {
      if (max === 0 || value === 0) return '#f0f0f0';

      const ratio = value / max;

      // Color gradient: light -> dark green
      if (ratio < 0.25) return '#c6e48b';
      if (ratio < 0.5) return '#7bc96f';
      if (ratio < 0.75) return '#239a3b';
      return '#196127';
    }

    async function renderKeywords() {
      const listEl = document.getElementById('keywordsList');
      const keywords = await AnalyticsService.getTopKeywords(10);

      if (!keywords || keywords.length === 0) {
        listEl.innerHTML = '<div class="empty-state"><div class="empty-state-text">暂无关键词数据</div></div>';
        return;
      }

      listEl.innerHTML = keywords.map(k => `
        <div class="keyword-tag">
          <span>${k.keyword}</span>
          <span class="keyword-tag-count">${k.count}</span>
        </div>
      `).join('');
    }

    // Initialize on load
    init();
  </script>
</body>
</html>
