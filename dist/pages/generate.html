<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Creator - 生成</title>
  <style>
    .page {
      padding: 16px;
      min-height: 100vh;
      background: #f5f5f5;
      padding-bottom: 80px;
    }

    /* Result Container */
    .result-container {
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-image {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .revised-prompt {
      padding: 8px 12px;
      background: #f0f4ff;
      border-radius: 8px;
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .revised-prompt .label {
      color: #1A73E8;
      font-weight: 500;
    }

    .result-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .btn-action {
      flex: 1;
      padding: 12px 0;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      color: #333;
      cursor: pointer;
    }

    /* Music Result */
    .music-result {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 12px;
    }

    .music-cover {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cover-placeholder {
      font-size: 32px;
    }

    .music-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .music-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .music-desc {
      font-size: 12px;
      color: #999;
    }

    .btn-play {
      width: 80px;
      padding: 8px 0;
      background: #1A73E8;
      color: #fff;
      border-radius: 16px;
      font-size: 14px;
      border: none;
      cursor: pointer;
    }

    .lyrics-section {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .lyrics-text {
      font-size: 13px;
      color: #666;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    /* TTS Result */
    .tts-result {
      background: #fff;
      border-radius: 12px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .tts-icon {
      font-size: 40px;
    }

    .tts-text {
      font-size: 14px;
      color: #666;
      text-align: center;
      line-height: 1.6;
    }

    /* Form Card */
    .form-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .type-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .credits-info {
      font-size: 12px;
      color: #1A73E8;
      font-weight: 400;
    }

    .prompt-input {
      width: 100%;
      min-height: 100px;
      padding: 12px;
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      box-sizing: border-box;
      margin-bottom: 12px;
      resize: vertical;
    }

    .param-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .param-label {
      font-size: 14px;
      color: #666;
    }

    .param-select {
      font-size: 14px;
      color: #1A73E8;
      padding: 4px 0;
      appearance: none;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .error-tip {
      padding: 8px 12px;
      background: #fff0f0;
      border-radius: 6px;
      color: #e53e3e;
      font-size: 13px;
      margin: 8px 0;
    }

    .btn-generate {
      width: 100%;
      padding: 14px 0;
      background: linear-gradient(135deg, #1A73E8, #4facfe);
      color: #fff;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 500;
      border: none;
      margin-top: 16px;
      cursor: pointer;
    }

    .btn-generate.disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-back {
      display: inline-block;
      margin-bottom: 12px;
      color: #1A73E8;
      font-size: 14px;
      cursor: pointer;
    }

    /* Template Button */
    .template-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      background: #f0f4ff;
      border: 1px solid #d0d9ff;
      border-radius: 16px;
      font-size: 12px;
      color: #1A73E8;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .template-btn:active {
      background: #dce5ff;
    }

    /* Batch Mode */
    .batch-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 16px;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      margin-left: 8px;
    }

    .batch-toggle.active {
      background: #e8f0ff;
      border-color: #1A73E8;
      color: #1A73E8;
    }

    .batch-controls {
      display: none;
      margin-bottom: 12px;
      padding: 12px;
      background: #f9f9f9;
      border-radius: 8px;
    }

    .batch-controls.visible {
      display: block;
    }

    .batch-size-label {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    .batch-size-btns {
      display: flex;
      gap: 8px;
    }

    .batch-size-btn {
      flex: 1;
      padding: 8px 0;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 13px;
      color: #666;
      cursor: pointer;
    }

    .batch-size-btn.selected {
      background: #1A73E8;
      border-color: #1A73E8;
      color: #fff;
    }

    .batch-prompt-tip {
      font-size: 11px;
      color: #999;
      margin-top: 8px;
    }

    /* Batch Results */
    .batch-result-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .batch-result-item {
      position: relative;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      padding-bottom: 12px;
    }

    .batch-result-item.failed {
      background: #fff0f0;
    }

    .batch-result-item img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
    }

    .batch-result-item .item-index {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .batch-result-item .item-failed-msg {
      font-size: 11px;
      color: #e53e3e;
      padding: 8px;
      text-align: center;
    }

    .batch-result-music {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 12px;
    }

    .batch-result-music.failed {
      background: #fff0f0;
    }

    .batch-result-tts {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .batch-result-tts.failed {
      background: #fff0f0;
    }

    .batch-progress {
      margin-bottom: 12px;
      padding: 12px;
      background: #f0f4ff;
      border-radius: 8px;
      font-size: 13px;
      color: #1A73E8;
      text-align: center;
    }

    .batch-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn-back-batch {
      display: inline-block;
      margin-bottom: 12px;
      color: #666;
      font-size: 14px;
      cursor: pointer;
    }

    /* Template Panel Overlay */
    .template-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }

    .template-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* Template Panel */
    .template-panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 60vh;
      background: #fff;
      border-radius: 16px 16px 0 0;
      z-index: 1000;
      transform: translateY(100%);
      transition: transform 0.3s ease-out;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .template-panel.active {
      transform: translateY(0);
    }

    .template-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid #f0f0f0;
      flex-shrink: 0;
    }

    .template-panel-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .template-panel-close {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f5f5f5;
      border: none;
      font-size: 18px;
      color: #666;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .template-panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 24px;
    }

    .template-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .template-card {
      background: #f9f9f9;
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .template-card:active {
      background: #f0f4ff;
      border-color: #1A73E8;
    }

    .template-card-name {
      font-size: 14px;
      font-weight: 500;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .template-card-desc {
      font-size: 11px;
      color: #999;
      margin-bottom: 6px;
    }

    .template-card-prompt {
      font-size: 11px;
      color: #666;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* Export Dropdown */
    .export-menu {
      position: relative;
      display: inline-block;
    }

    .export-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      min-width: 140px;
      z-index: 100;
      display: none;
      overflow: hidden;
    }

    .export-dropdown.active {
      display: block;
    }

    .export-item {
      padding: 12px 16px;
      font-size: 14px;
      color: #333;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .export-item:active {
      background: #f5f5f5;
    }

    /* Progress Bar */
    .progress-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .progress-box {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      width: 280px;
      text-align: center;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #f0f0f0;
      border-radius: 4px;
      overflow: hidden;
      margin: 16px 0;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(135deg, #1A73E8, #4facfe);
      border-radius: 4px;
      transition: width 0.3s;
    }

    .progress-text {
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="page">
    <span class="btn-back" onclick="window.history.back()">← 返回</span>

    <!-- Result View -->
    <div id="resultView" style="display:none;"></div>

    <!-- Form View -->
    <div id="formView">
      <div class="form-card">
        <div class="type-label">
          <span id="typeLabel">🖼️ 图片生成</span>
          <span class="credits-info" id="creditsInfo">剩余 0 积分</span>
        </div>

        <button class="template-btn" id="templateBtn" onclick="openTemplatePanel()">
          📋 模板中心
        </button>
        <button class="batch-toggle" id="batchToggle" onclick="toggleBatchMode()">
          📦 批量
        </button>

        <div class="batch-controls" id="batchControls">
          <div class="batch-size-label">生成数量</div>
          <div class="batch-size-btns">
            <button class="batch-size-btn" data-size="3" onclick="selectBatchSize(3)">3张</button>
            <button class="batch-size-btn selected" data-size="5" onclick="selectBatchSize(5)">5张</button>
            <button class="batch-size-btn" data-size="10" onclick="selectBatchSize(10)">10张</button>
          </div>
          <div class="batch-prompt-tip" id="batchPromptTip">每行一个描述，最多生成10张</div>
        </div>

        <textarea
          id="promptInput"
          class="prompt-input"
          placeholder="描述你想要的图片，例如：一只穿西装的猫在弹钢琴"
          maxlength="2000"
        ></textarea>

        <!-- Image Params -->
        <div id="imageParams">
          <div class="param-section">
            <span class="param-label">风格</span>
            <select id="styleSelect" class="param-select">
              <option value="vivid">写实</option>
              <option value="natural">自然</option>
            </select>
          </div>
          <div class="param-section">
            <span class="param-label">比例</span>
            <select id="sizeSelect" class="param-select">
              <option value="1024x1024">1:1</option>
              <option value="1024x1792">9:16</option>
              <option value="1792x1024">16:9</option>
            </select>
          </div>
        </div>

        <!-- Music Params -->
        <div id="musicParams" style="display:none;">
          <div class="param-section">
            <span class="param-label">风格</span>
            <select id="genreSelect" class="param-select">
              <option value="pop">流行</option>
              <option value="rock">摇滚</option>
              <option value="jazz">爵士</option>
              <option value="classical">古典</option>
              <option value="electronic">电子</option>
              <option value="folk">民谣</option>
            </select>
          </div>
          <div class="param-section">
            <span class="param-label">时长</span>
            <select id="durationSelect" class="param-select">
              <option value="30">30秒</option>
              <option value="60">60秒</option>
              <option value="120">2分钟</option>
              <option value="180">3分钟</option>
            </select>
          </div>
        </div>

        <!-- TTS Params -->
        <div id="ttsParams" style="display:none;">
          <div class="param-section">
            <span class="param-label">音色</span>
            <select id="voiceSelect" class="param-select">
              <option value="female-shaonv">少女声音</option>
              <option value="male-qn-qingse">青年男声</option>
              <option value="female-yujie">御姐声音</option>
              <option value="male-qn-jingxing">激情男声</option>
            </select>
          </div>
        </div>

        <div id="errorTip" class="error-tip" style="display:none;"></div>

        <button id="generateBtn" class="btn-generate" onclick="onGenerate()">
          🚀 开始生成
        </button>
      </div>
    </div>

    <!-- Audio element for TTS playback -->
    <audio id="ttsAudio" style="display:none;"></audio>

    <!-- Template Panel -->
    <div class="template-overlay" id="templateOverlay" onclick="closeTemplatePanel()"></div>
    <div class="template-panel" id="templatePanel">
      <div class="template-panel-header">
        <span class="template-panel-title">📋 选择模板</span>
        <button class="template-panel-close" onclick="closeTemplatePanel()">×</button>
      </div>
      <div class="template-panel-content">
        <div class="template-grid" id="templateGrid"></div>
      </div>
    </div>

    <!-- Progress Overlay for ZIP -->
    <div class="progress-overlay" id="progressOverlay" style="display:none;">
      <div class="progress-box">
        <div class="progress-text" id="progressText">准备中...</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <div class="progress-text" id="progressCount">0/0</div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      type: 'image',
      prompt: '',
      imageStyle: 'vivid',
      imageSize: '1024x1024',
      musicGenre: 'pop',
      musicDuration: 60,
      ttsVoice: 'female-shaonj',
      isGenerating: false,
      result: null,
      batchMode: false,
      batchSize: 5,
      batchResults: [],
      batchProgress: 0,
    };

    const typeLabels = {
      image: '🖼️ 图片生成',
      music: '🎵 音乐生成',
      tts: '🎤 语音合成',
    };

    const placeholders = {
      image: '描述你想要的图片，例如：一只穿西装的猫在弹钢琴',
      music: '描述你想要的音乐风格，例如：欢快的夏日海滩派对音乐',
      tts: '输入要转换的文字内容',
    };

    const batchPromptTips = {
      image: '每行一个描述，最多生成10张',
      music: '每行一个描述，最多生成5首',
      tts: '每段文字用空行分隔，最多10段',
    };

    window.pageInit = function(params) {
      state.type = params.type || 'image';
      // Reset batch mode when switching types
      state.batchMode = false;
      state.batchResults = [];
      state.batchProgress = 0;
      document.getElementById('batchToggle').classList.remove('active');
      document.getElementById('batchControls').classList.remove('visible');

      document.getElementById('typeLabel').textContent = typeLabels[state.type];
      document.getElementById('promptInput').placeholder = placeholders[state.type];
      document.getElementById('batchPromptTip').textContent = batchPromptTips[state.type];

      // Show/hide param sections
      document.getElementById('imageParams').style.display = state.type === 'image' ? 'block' : 'none';
      document.getElementById('musicParams').style.display = state.type === 'music' ? 'block' : 'none';
      document.getElementById('ttsParams').style.display = state.type === 'tts' ? 'block' : 'none';

      // Update type-specific label
      const label = document.getElementById('typeLabel');
      if (state.type === 'image') label.textContent = '🖼️ 图片生成';
      else if (state.type === 'music') label.textContent = '🎵 音乐生成';
      else if (state.type === 'tts') label.textContent = '🎤 语音合成';

      refreshCredits();
      hideResult();
    };

    function refreshCredits() {
      const app = getApp();
      document.getElementById('creditsInfo').textContent = '剩余 ' + Number(app.globalData.credits) + ' 积分';
    }

    function showError(msg) {
      const el = document.getElementById('errorTip');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function clearError() {
      document.getElementById('errorTip').style.display = 'none';
    }

    function showResult(result) {
      state.result = result;
      document.getElementById('formView').style.display = 'none';
      const container = document.getElementById('resultView');
      container.style.display = 'block';

      if (state.type === 'image') {
        container.innerHTML = `
          <div class="result-container">
            <img src="${result.url}" class="result-image" onclick="previewImage(['${result.url}'])">
            ${result.revised_prompt ? `<div class="revised-prompt"><span class="label">优化后描述：</span>${result.revised_prompt}</div>` : ''}
            <div class="result-actions">
              <button class="btn-action" onclick="onSave()">💾 保存</button>
              <button class="btn-action" onclick="onFavorite('image', '${result.url}')">⭐ 收藏</button>
              <div class="export-menu" onclick="event.stopPropagation();">
                <button class="btn-action" onclick="toggleExportMenu()">📤 导出</button>
                <div class="export-dropdown" id="exportDropdown">
                  <div class="export-item" onclick="onExportImage('png')">📷 PNG</div>
                  <div class="export-item" onclick="onExportImage('jpeg')">🖼️ JPEG</div>
                  <div class="export-item" onclick="onCopyLink()">🔗 复制链接</div>
                </div>
              </div>
              <button class="btn-action" onclick="onShare()">📱 分享</button>
              <button class="btn-action" onclick="onRegenerate()">🔄 重新生成</button>
            </div>
          </div>
        `;
      } else if (state.type === 'music') {
        container.innerHTML = `
          <div class="result-container">
            <div class="music-result">
              <div class="music-cover">
                ${result.coverUrl ? `<img src="${result.coverUrl}" class="cover-img">` : '<span class="cover-placeholder">🎵</span>'}
              </div>
              <div class="music-info">
                <span class="music-title">AI 创作音乐</span>
                <span class="music-desc">时长：${result.duration}秒</span>
                <button class="btn-play" onclick="playMusic()">▶ 播放</button>
              </div>
            </div>
            ${result.lyrics ? `<div class="lyrics-section"><span class="section-title">歌词</span><span class="lyrics-text">${result.lyrics}</span></div>` : ''}
            <div class="result-actions">

    async function onGenerate() {
      const prompt = document.getElementById('promptInput').value.trim();
      if (!prompt) { showError('请输入内容描述'); return; }
      clearError();

      // Parse prompts based on mode
      let prompts = [];
      if (state.batchMode) {
        if (state.type === 'tts') {
          // TTS: split by empty lines
          prompts = prompt.split(/\n\s*\n/).map(p => p.trim()).filter(p => p);
        } else {
          // Image/Music: split by newlines
          prompts = prompt.split('\n').map(p => p.trim()).filter(p => p);
        }
        const maxBatch = state.type === 'music' ? 5 : 10;
        if (prompts.length > maxBatch) {
          showError(`批量数量不能超过${maxBatch}个`);
          return;
        }
        if (prompts.length === 0) {
          showError('请输入有效的生成内容');
          return;
        }
      } else {
        prompts = [prompt];
      }

      if (!contentModeration(prompt)) {
        showError('输入内容包含敏感词，请修改后重试');
        return;
      }

      const app = getApp();
      if (Number(app.globalData.credits) <= 0) {
        showModal({
          title: '积分不足',
          content: '您的积分不足，请先充值',
          confirmText: '充值',
        }).then(res => { if (res.confirm) window.location.hash = '/pages/my.html'; });
        return;
      }

      state.isGenerating = true;
      const btn = document.getElementById('generateBtn');
      btn.textContent = state.batchMode ? '批量生成中...' : '生成中...';
      btn.classList.add('disabled');

      try {
        let result;
        if (state.type === 'image') {
          if (state.batchMode) {
            result = await doBatchGenerateImage(prompts);
          } else {
            result = await doGenerateImage(prompt);
          }
        } else if (state.type === 'music') {
          if (state.batchMode) {
            result = await doBatchGenerateMusic(prompts);
          } else {
            result = await doGenerateMusic(prompt);
          }
        } else if (state.type === 'tts') {
          if (state.batchMode) {
            result = await doBatchGenerateTTS(prompts);
          } else {
            result = await doGenerateTTS(prompt);
          }
        }
        if (state.batchMode) {
          showBatchResults(result);
        } else {
          showResult(result);
        }
      } catch (e) {
        showError(e.message || '生成失败');
      } finally {
        state.isGenerating = false;
        btn.textContent = '🚀 开始生成';
        btn.classList.remove('disabled');
        refreshCredits();
      }
    }

    async function doGenerateImage(prompt) {
      showLoading('AI 创作中...');
      try {
        const { generateImage, saveImageHistory } = await import('../services/imageService.js');
        const { recordImageGenerated, checkAndUnlockAchievements, showNewAchievements } = await import('../services/achievementService.js');
        const style = document.getElementById('styleSelect').value;
        const size = document.getElementById('sizeSelect').value;
        const res = await generateImage({ prompt, style, size });
        const url = res.data?.[0]?.url;
        if (!url) throw new Error('未获取到生成结果');
        saveImageHistory({ prompt, url, style, size });
        recordImageGenerated(style, size);
        const newAchievements = checkAndUnlockAchievements();
        if (newAchievements.length > 0) showNewAchievements(newAchievements);
        getApp().updateCredits(-1);
        return { url, revised_prompt: res.data?.[0]?.revised_prompt };
      } finally {
        hideLoading();
      }
    }

    async function doBatchGenerateTTS(prompts) {
      const { batchGenerateSpeech, saveB64AudioAsDataUrl, saveTTSHistory } = await import('../services/ttsService.js');
      const { recordAudioGenerated, checkAndUnlockAchievements, showNewAchievements } = await import('../services/achievementService.js');
      const voice = document.getElementById('voiceSelect').value;
      const voiceName = { 'female-shaonv': '少女声音', 'male-qn-qingse': '青年男声', 'female-yujie': '御姐声音', 'male-qn-jingxing': '激情男声' }[voice] || voice;

    async function onExportImage(format) {
      if (!state.result || !state.result.url) return;
      toggleExportMenu();
      
      try {
        showLoading('正在导出...');
        const imgUrl = state.result.url;
        
        // Convert to desired format
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.crossOrigin = 'anonymous';
        
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
          img.src = imgUrl;
        });
        
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        
        const mimeType = format === 'png' ? 'image/png' : 'image/jpeg';
        const quality = format === 'jpeg' ? 0.92 : undefined;
        const dataUrl = canvas.toDataURL(mimeType, quality);
        
        // Download
        const link = document.createElement('a');
        link.download = `ai-image-${Date.now()}.${format}`;
        link.href = dataUrl;
        link.click();
        
        hideLoading();
        showToast('已导出 ' + format.toUpperCase(), 'success');
      } catch (e) {
        hideLoading();
        showToast('导出失败', 'error');
        console.error(e);
      }
    }

        if (result.params) {
          if (state.type === 'image') {
            if (result.params.style) document.getElementById('styleSelect').value = result.params.style;
            if (result.params.size) document.getElementById('sizeSelect').value = result.params.size;
          } else if (state.type === 'music') {
            if (result.params.genre) document.getElementById('genreSelect').value = result.params.genre;
            if (result.params.duration) document.getElementById('durationSelect').value = result.params.duration;
          } else if (state.type === 'tts') {
            if (result.params.voice) document.getElementById('voiceSelect').value = result.params.voice;
          }
        }
        closeTemplatePanel();
        showToast('模板已应用，请修改占位符内容', 'success');
      }
    }
  </script>
</body>
</html>
