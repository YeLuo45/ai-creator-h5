<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>插件市场 - AI Creator H5</title>
  <link rel="stylesheet" href="../app.css">
  <style>
    :root {
      --primary: #6366F1;
      --primary-dark: #4F46E5;
      --bg-dark: #0F0F1A;
      --bg-panel: #1A1A2E;
      --bg-node: #252542;
      --border: #333355;
      --text: #E0E0FF;
      --text-dim: #8888AA;
      --success: #10B981;
      --warning: #F59E0B;
      --error: #EF4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans SC', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
    }

    .page-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    /* Header */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .page-title {
      font-size: 28px;
      font-weight: 600;
      color: var(--primary);
    }

    .page-subtitle {
      font-size: 14px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* Search Bar */
    .search-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .search-input {
      flex: 1;
      padding: 12px 16px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* Category Filters */
    .category-filters {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .category-btn {
      padding: 8px 16px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .category-btn:hover {
      background: var(--bg-node);
    }

    .category-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    /* Plugin Grid */
    .plugin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .plugin-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      transition: all 0.2s;
    }

    .plugin-card:hover {
      border-color: var(--primary);
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.2);
    }

    .plugin-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .plugin-icon {
      width: 48px;
      height: 48px;
      background: var(--bg-node);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .plugin-info {
      flex: 1;
    }

    .plugin-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .plugin-version {
      font-size: 12px;
      color: var(--text-dim);
    }

    .plugin-badge {
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      background: var(--bg-node);
      color: var(--text-dim);
    }

    .plugin-badge.installed {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
    }

    .plugin-desc {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .plugin-meta {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      font-size: 12px;
    }

    .plugin-category, .plugin-nodes {
      color: var(--text-dim);
    }

    .plugin-actions {
      display: flex;
      gap: 8px;
    }

    /* Buttons */
    .btn-small {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .btn-small:hover {
      background: var(--bg-node);
    }

    .btn-small.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .btn-small.primary:hover {
      background: var(--primary-dark);
    }

    .btn-small.danger {
      border-color: var(--error);
      color: var(--error);
    }

    .btn-small.danger:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    .empty-title {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .empty-desc {
      font-size: 14px;
    }

    /* Custom Node Builder Section */
    .builder-section {
      margin-top: 40px;
      padding: 24px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .builder-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .builder-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .form-textarea {
      min-height: 120px;
      font-family: 'Monaco', 'Consolas', monospace;
      resize: vertical;
    }

    .form-hint {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .builder-preview {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }

    .preview-placeholder {
      color: var(--text-dim);
      font-size: 13px;
      text-align: center;
      padding: 40px;
    }

    .preview-node {
      border: 2px solid var(--primary);
      border-radius: 8px;
      padding: 12px;
    }

    .preview-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .preview-icon {
      width: 28px;
      height: 28px;
      background: var(--primary);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .preview-name {
      font-size: 14px;
      font-weight: 500;
    }

    .preview-desc {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    .preview-ports {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
    }

    .port-label {
      color: var(--text-dim);
      margin-right: 8px;
    }

    .port-tag {
      display: inline-block;
      padding: 2px 8px;
      background: var(--bg-node);
      border-radius: 4px;
      margin-right: 4px;
      margin-bottom: 4px;
    }

    .port-tag.none {
      color: var(--text-dim);
      font-style: italic;
    }

    .builder-actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .error-message {
      color: var(--error);
      font-size: 12px;
      margin-top: 8px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 600px;
      max-height: 80vh;
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 20px;
    }

    .modal-close:hover {
      color: var(--text);
    }

    .modal-body {
      padding: 20px;
      max-height: 60vh;
      overflow-y: auto;
    }

    /* Plugin Detail */
    .detail-header {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }

    .detail-icon {
      width: 64px;
      height: 64px;
      background: var(--bg-node);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .detail-info {
      flex: 1;
    }

    .detail-name {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .detail-version {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 2px;
    }

    .detail-author {
      font-size: 13px;
      color: var(--text-dim);
    }

    .detail-section {
      margin-bottom: 20px;
    }

    .detail-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--primary);
    }

    .detail-desc {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.6;
    }

    .node-preview {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .node-preview-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .node-preview-header .node-name {
      font-weight: 500;
    }

    .node-preview-header .node-id {
      font-size: 11px;
      color: var(--text-dim);
      font-family: monospace;
    }

    .node-preview .node-desc {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .node-ports {
      display: flex;
      gap: 16px;
      font-size: 12px;
    }

    .node-inputs, .node-outputs {
      flex: 1;
    }

    .node-inputs .port-label, .node-outputs .port-label {
      color: var(--text-dim);
    }

    .node-inputs .port-item, .node-outputs .port-item {
      display: inline-block;
      padding: 2px 6px;
      background: var(--bg-node);
      border-radius: 3px;
      margin-right: 4px;
      font-size: 11px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-panel);
      border: 1px solid var(--border);
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 2000;
      opacity: 0;
      transition: all 0.3s;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .builder-form {
        grid-template-columns: 1fr;
      }
      
      .plugin-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page-container">
    <!-- Header -->
    <div class="page-header">
      <div>
        <h1 class="page-title">🎨 插件市场</h1>
        <p class="page-subtitle">扩展工作流节点能力，支持自定义节点创建</p>
      </div>
      <button class="btn-small primary" onclick="showNodeBuilder()">
        ➕ 创建自定义节点
      </button>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <input type="text" class="search-input" id="plugin-search-input" placeholder="搜索插件...">
    </div>

    <!-- Category Filters -->
    <div class="category-filters" id="category-filters">
      <button class="category-btn active" data-category="all">全部</button>
      <button class="category-btn" data-category="data">数据处理</button>
      <button class="category-btn" data-category="string">字符串</button>
      <button class="category-btn" data-category="math">数学计算</button>
      <button class="category-btn" data-category="custom">自定义</button>
    </div>

    <!-- Plugin List -->
    <div class="plugin-grid" id="plugin-list-container">
      <!-- Plugins will be rendered here -->
    </div>

    <!-- Custom Node Builder -->
    <div class="builder-section">
      <h2 class="builder-title">🛠️ 自定义节点创建器</h2>
      <div class="builder-form" id="node-builder-form">
        <div class="builder-left">
          <div class="form-group">
            <label class="form-label">节点 ID *</label>
            <input type="text" class="form-input" id="builder-node-id" placeholder="如: myCustomNode" required>
            <div class="form-hint">唯一标识，只能包含字母、数字、下划线</div>
          </div>
          <div class="form-group">
            <label class="form-label">节点名称 *</label>
            <input type="text" class="form-input" id="builder-node-name" placeholder="如: 我的自定义节点" required>
          </div>
          <div class="form-group">
            <label class="form-label">描述</label>
            <input type="text" class="form-input" id="builder-node-desc" placeholder="节点功能描述">
          </div>
          <div class="form-group">
            <label class="form-label">输入端口 (格式: name:标签:type, ...)</label>
            <input type="text" class="form-input" id="builder-inputs" placeholder="如: text:文本:string, count:数量:number">
            <div class="form-hint">多个端口用逗号分隔</div>
          </div>
          <div class="form-group">
            <label class="form-label">输出端口 (格式: name:标签:type, ...)</label>
            <input type="text" class="form-input" id="builder-outputs" placeholder="如: result:结果:string">
            <div class="form-hint">多个端口用逗号分隔</div>
          </div>
        </div>
        <div class="builder-right">
          <div class="form-group">
            <label class="form-label">执行代码 *</label>
            <textarea class="form-textarea" id="builder-code" placeholder="// 使用 inputs 获取输入，返回结果
return inputs.text.toUpperCase();"></textarea>
            <div class="form-hint">代码中可使用 inputs 访问输入参数，必须有返回值</div>
          </div>
          <div class="error-message" id="node-builder-error"></div>
        </div>
        <div class="builder-actions">
          <button type="button" class="btn-small" onclick="previewNode()">👁 预览</button>
          <button type="button" class="btn-small primary" onclick="submitNode()">✅ 创建节点</button>
        </div>
      </div>
      <div class="builder-preview" id="node-preview">
        <div class="preview-placeholder">填写左侧信息后点击预览</div>
      </div>
    </div>
  </div>

  <!-- Plugin Detail Modal -->
  <div class="modal-overlay" id="plugin-detail-modal">
    <div class="modal">
      <div class="modal-header">
        <span>插件详情</span>
        <button class="modal-close" onclick="closeModal('plugin-detail-modal')">×</button>
      </div>
      <div class="modal-body" id="plugin-detail-content">
        <!-- Content will be rendered here -->
      </div>
    </div>
  </div>

  <!-- Node Builder Modal -->
  <div class="modal-overlay" id="node-builder-modal">
    <div class="modal" style="width: 700px;">
      <div class="modal-header">
        <span>🛠️ 创建自定义节点</span>
        <button class="modal-close" onclick="closeModal('node-builder-modal')">×</button>
      </div>
      <div class="modal-body">
        <p style="color: var(--text-dim); margin-bottom: 16px;">
          自定义节点允许你编写 JavaScript 代码来处理输入并产生输出。代码运行在沙箱环境中，安全可靠。
        </p>
        <div class="builder-form">
          <div class="builder-left">
            <div class="form-group">
              <label class="form-label">节点 ID *</label>
              <input type="text" class="form-input" id="modal-node-id" placeholder="如: myCustomNode">
            </div>
            <div class="form-group">
              <label class="form-label">节点名称 *</label>
              <input type="text" class="form-input" id="modal-node-name" placeholder="如: 我的自定义节点">
            </div>
            <div class="form-group">
              <label class="form-label">描述</label>
              <input type="text" class="form-input" id="modal-node-desc" placeholder="节点功能描述">
            </div>
          </div>
          <div class="builder-right">
            <div class="form-group">
              <label class="form-label">输入端口</label>
              <input type="text" class="form-input" id="modal-inputs" placeholder="name:标签:type, ...">
            </div>
            <div class="form-group">
              <label class="form-label">输出端口</label>
              <input type="text" class="form-input" id="modal-outputs" placeholder="name:标签:type, ...">
            </div>
          </div>
          <div class="form-group" style="grid-column: 1 / -1;">
            <label class="form-label">执行代码 *</label>
            <textarea class="form-textarea" id="modal-code" rows="6" placeholder="return inputs.value;"></textarea>
          </div>
        </div>
        <div class="builder-actions">
          <button class="btn-small" onclick="closeModal('node-builder-modal')">取消</button>
          <button class="btn-small primary" onclick="submitNodeFromModal()">创建</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Scripts -->
  <script src="../services/pluginRegistry.js"></script>
  <script src="../services/nodeBuilder.js"></script>
  <script src="../services/sandboxRunner.js"></script>
  <script src="../services/pluginMarketUI.js"></script>
  <script>
    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      pluginRegistry.init();
      nodeBuilder.init();
      initPluginMarket();
    });

    // Toast function
    function showToast(message, duration = 3000) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), duration);
    }

    // Close modal
    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    // Preview node
    function previewNode() {
      const id = document.getElementById('builder-node-id')?.value || '';
      const name = document.getElementById('builder-node-name')?.value || '';
      const desc = document.getElementById('builder-node-desc')?.value || '';
      const inputsStr = document.getElementById('builder-inputs')?.value || '';
      const outputsStr = document.getElementById('builder-outputs')?.value || '';

      const inputs = inputsStr.split(',').map(s => {
        const parts = s.trim().split(':');
        return { name: parts[0] || '', label: parts[1] || parts[0] || '', type: parts[2] || 'string' };
      }).filter(p => p.name);

      const outputs = outputsStr.split(',').map(s => {
        const parts = s.trim().split(':');
        return { name: parts[0] || '', label: parts[1] || parts[0] || '', type: parts[2] || 'string' };
      }).filter(p => p.name);

      const definition = { id, name, description: desc, inputs, outputs };
      renderNodePreview(definition);

      // Validate code
      const code = document.getElementById('builder-code')?.value || '';
      if (code) {
        const validation = validateNodeCode(code);
        const errorDiv = document.getElementById('node-builder-error');
        if (!validation.valid) {
          errorDiv.textContent = validation.error;
        } else {
          errorDiv.textContent = '';
        }
      }
    }

    // Submit node from main form
    function submitNode() {
      const id = document.getElementById('builder-node-id')?.value.trim();
      const name = document.getElementById('builder-node-name')?.value.trim();
      const desc = document.getElementById('builder-node-desc')?.value.trim();
      const inputsStr = document.getElementById('builder-inputs')?.value || '';
      const outputsStr = document.getElementById('builder-outputs')?.value || '';
      const code = document.getElementById('builder-code')?.value.trim();

      // Validate required fields
      if (!id || !name || !code) {
        showToast('请填写必填字段：节点ID、节点名称、执行代码');
        return;
      }

      // Validate ID format
      if (!/^[a-zA-Z0-9_-]+$/.test(id)) {
        showToast('节点ID只能包含字母、数字、下划线和连字符');
        return;
      }

      // Validate code
      const validation = validateNodeCode(code);
      if (!validation.valid) {
        showToast('代码验证失败: ' + validation.error);
        return;
      }

      // Parse ports
      const inputs = inputsStr.split(',').map(s => {
        const parts = s.trim().split(':');
        return { name: parts[0] || '', label: parts[1] || parts[0] || '', type: parts[2] || 'string' };
      }).filter(p => p.name);

      const outputs = outputsStr.split(',').map(s => {
        const parts = s.trim().split(':');
        return { name: parts[0] || '', label: parts[1] || parts[0] || '', type: parts[2] || 'string' };
      }).filter(p => p.name);

      const definition = {
        id,
        name,
        description: desc,
        category: 'custom',
        inputs,
        outputs,
        code
      };

      const result = nodeBuilder.registerNode(definition);
      if (result.success) {
        showToast('节点创建成功');
        // Reset form
        document.getElementById('builder-node-id').value = '';
        document.getElementById('builder-node-name').value = '';
        document.getElementById('builder-node-desc').value = '';
        document.getElementById('builder-inputs').value = '';
        document.getElementById('builder-outputs').value = '';
        document.getElementById('builder-code').value = '';
        document.getElementById('node-preview').innerHTML = '<div class="preview-placeholder">填写左侧信息后点击预览</div>';
        // Reload plugin list to show custom nodes
        loadPluginList();
      } else {
        showToast('创建失败: ' + result.errors.join(', '));
      }
    }

    // Submit node from modal
    function submitNodeFromModal() {
      const id = document.getElementById('modal-node-id')?.value.trim();
      const name = document.getElementById('modal-node-name')?.value.trim();
      const desc = document.getElementById('modal-node-desc')?.value.trim();
      const inputsStr = document.getElementById('modal-inputs')?.value || '';
      const outputsStr = document.getElementById('modal-outputs')?.value || '';
      const code = document.getElementById('modal-code')?.value.trim();

      if (!id || !name || !code) {
        showToast('请填写必填字段');
        return;
      }

      const inputs = inputsStr.split(',').map(s => {
        const parts = s.trim().split(':');
        return { name: parts[0] || '', label: parts[1] || parts[0] || '', type: parts[2] || 'string' };
      }).filter(p => p.name);

      const outputs = outputsStr.split(',').map(s => {
        const parts = s.trim().split(':');
        return { name: parts[0] || '', label: parts[1] || parts[0] || '', type: parts[2] || 'string' };
      }).filter(p => p.name);

      const definition = {
        id,
        name,
        description: desc,
        category: 'custom',
        inputs,
        outputs,
        code
      };

      const result = nodeBuilder.registerNode(definition);
      if (result.success) {
        showToast('节点创建成功');
        closeModal('node-builder-modal');
        loadPluginList();
      } else {
        showToast('创建失败: ' + result.errors.join(', '));
      }
    }

    // Custom node created callback
    function onCustomNodeCreated(definition) {
      console.log('[Workflow] Custom node created:', definition);
      loadPluginList();
    }
  </script>
</body>
</html>
