<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Creator - 创作档案</title>
  <style>
    .page {
      padding: 16px;
      min-height: 100vh;
      background: #f5f5f5;
      padding-bottom: 80px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .page-title {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .btn-clear {
      padding: 6px 12px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 12px;
      color: #999;
      cursor: pointer;
    }

    .btn-clear:active {
      background: #fff0f0;
      border-color: #e53e3e;
      color: #e53e3e;
    }

    /* Stats Card */
    .stats-card {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      color: #fff;
    }

    .stats-title {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 8px;
    }

    .stats-number {
      font-size: 36px;
      font-weight: 700;
    }

    .stats-sub {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 4px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .stats-item {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 12px 8px;
      text-align: center;
    }

    .stats-item-icon {
      font-size: 20px;
      margin-bottom: 4px;
    }

    .stats-item-value {
      font-size: 20px;
      font-weight: 600;
    }

    .stats-item-label {
      font-size: 10px;
      opacity: 0.8;
    }

    /* Type Distribution */
    .type-dist-card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .type-bars {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .type-bar-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .type-bar-label {
      font-size: 13px;
      color: #666;
      width: 50px;
      flex-shrink: 0;
    }

    .type-bar-track {
      flex: 1;
      height: 8px;
      background: #f0f0f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .type-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .type-bar-fill.image { background: linear-gradient(90deg, #1A73E8, #4facfe); }
    .type-bar-fill.music { background: linear-gradient(90deg, #667eea, #764ba2); }
    .type-bar-fill.tts { background: linear-gradient(90deg, #f093fb, #f5576c); }

    .type-bar-value {
      font-size: 12px;
      color: #999;
      width: 36px;
      text-align: right;
      flex-shrink: 0;
    }

    /* Keywords Cloud */
    .keywords-card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .keyword-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .keyword-tag {
      padding: 6px 14px;
      background: #f0f4ff;
      border-radius: 16px;
      font-size: 13px;
      color: #1A73E8;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .keyword-tag:hover {
      background: #dce5ff;
      transform: scale(1.05);
    }

    .keyword-tag.active {
      background: #1A73E8;
      color: #fff;
    }

    .keyword-tag.size-large { font-size: 15px; padding: 8px 16px; }
    .keyword-tag.size-medium { font-size: 13px; padding: 6px 14px; }
    .keyword-tag.size-small { font-size: 11px; padding: 4px 10px; }

    /* Empty State */
    .empty-cloud {
      text-align: center;
      padding: 24px;
      color: #999;
      font-size: 13px;
    }

    /* Recommendations Section */
    .recommend-card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .recommend-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .recommend-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      background: #f9f9f9;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .recommend-item:active {
      background: #f0f4ff;
      transform: scale(0.98);
    }

    .recommend-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: linear-gradient(135deg, #1A73E8, #4facfe);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .recommend-icon.music {
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .recommend-icon.tts {
      background: linear-gradient(135deg, #f093fb, #f5576c);
    }

    .recommend-content {
      flex: 1;
      min-width: 0;
    }

    .recommend-prompt {
      font-size: 13px;
      color: #333;
      line-height: 1.5;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .recommend-reason {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }

    /* History List */
    .history-card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 8px;
    }

    .history-type-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .history-type-icon.image {
      background: linear-gradient(135deg, #1A73E8, #4facfe);
    }

    .history-type-icon.music {
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .history-type-icon.tts {
      background: linear-gradient(135deg, #f093fb, #f5576c);
    }

    .history-content {
      flex: 1;
      min-width: 0;
    }

    .history-prompt {
      font-size: 13px;
      color: #333;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-time {
      font-size: 11px;
      color: #999;
      margin-top: 2px;
    }

    .history-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .history-tag {
      font-size: 10px;
      padding: 2px 6px;
      background: #f0f4ff;
      color: #1A73E8;
      border-radius: 4px;
    }

    .history-delete {
      padding: 6px;
      color: #999;
      font-size: 16px;
      cursor: pointer;
    }

    .history-delete:active {
      color: #e53e3e;
    }

    /* Section Header */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-more {
      font-size: 12px;
      color: #1A73E8;
      cursor: pointer;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-text {
      font-size: 14px;
      color: #999;
    }

    .empty-action {
      margin-top: 16px;
      display: inline-block;
      padding: 10px 24px;
      background: linear-gradient(135deg, #1A73E8, #4facfe);
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    /* Loading */
    .loading-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e0e0e0;
      border-top-color: #1A73E8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <span class="page-title">📊 创作档案</span>
      <button class="btn-clear" onclick="onClearMemory()">清除记忆</button>
    </div>

    <!-- Loading State -->
    <div id="loadingView" class="loading-container">
      <div class="loading-spinner"></div>
    </div>

    <!-- Content View -->
    <div id="contentView" style="display:none;">
      <!-- Stats Card -->
      <div class="stats-card">
        <div class="stats-title">总创作数</div>
        <div class="stats-number" id="totalCount">0</div>
        <div class="stats-sub">次创作记录</div>
        <div class="stats-grid">
          <div class="stats-item">
            <div class="stats-item-icon">🖼️</div>
            <div class="stats-item-value" id="imageCount">0</div>
            <div class="stats-item-label">图片</div>
          </div>
          <div class="stats-item">
            <div class="stats-item-icon">🎵</div>
            <div class="stats-item-value" id="musicCount">0</div>
            <div class="stats-item-label">音乐</div>
          </div>
          <div class="stats-item">
            <div class="stats-item-icon">🎤</div>
            <div class="stats-item-value" id="ttsCount">0</div>
            <div class="stats-item-label">语音</div>
          </div>
        </div>
      </div>

      <!-- Type Distribution -->
      <div class="type-dist-card">
        <div class="card-title">📈 类型分布</div>
        <div class="type-bars" id="typeBars"></div>
      </div>

      <!-- Keywords Cloud -->
      <div class="keywords-card">
        <div class="card-title">🏷️ 高频主题</div>
        <div class="keyword-cloud" id="keywordCloud"></div>
      </div>

      <!-- Smart Recommendations -->
      <div class="recommend-card">
        <div class="section-header">
          <div class="section-title">💡 智能推荐</div>
        </div>
        <div class="recommend-list" id="recommendList"></div>
      </div>

      <!-- Recent History -->
      <div class="history-card">
        <div class="section-header">
          <div class="section-title">🕐 最近创作</div>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>

    <!-- Empty State -->
    <div id="emptyView" class="empty-state" style="display:none;">
      <div class="empty-icon">🧠</div>
      <div class="empty-text">还没有创作记录</div>
      <div class="empty-text" style="margin-top:8px;font-size:12px;">开始创作，AI会记住你的偏好</div>
      <div class="empty-action" onclick="goToGenerate()">去创作 ✨</div>
    </div>
  </div>

  <script>
    let state = {
      preferences: null,
      recentGenerations: [],
      recommendations: []
    };

    window.pageInit = async function(params) {
      await loadMemoryData();
    };

    async function loadMemoryData() {
      try {
        const MemoryService = window.MemoryService;
        
        // 并行加载所有数据
        const [preferences, recentGenerations, recommendations] = await Promise.all([
          MemoryService.analyzePreferences(),
          MemoryService.getRecentGenerations(10),
          MemoryService.getRecommendations(null, 5)
        ]);

        state.preferences = preferences;
        state.recentGenerations = recentGenerations;
        state.recommendations = recommendations;

        renderData();
      } catch (e) {
        console.error('加载记忆数据失败:', e);
        showEmpty();
      }
    }

    function renderData() {
      document.getElementById('loadingView').style.display = 'none';

      if (state.preferences.totalCount === 0) {
        showEmpty();
        return;
      }

      document.getElementById('contentView').style.display = 'block';
      document.getElementById('emptyView').style.display = 'none';

      // Render Stats
      document.getElementById('totalCount').textContent = state.preferences.totalCount;
      document.getElementById('imageCount').textContent = state.preferences.typeStats.image;
      document.getElementById('musicCount').textContent = state.preferences.typeStats.music;
      document.getElementById('ttsCount').textContent = state.preferences.typeStats.tts;

      // Render Type Bars
      renderTypeBars();

      // Render Keyword Cloud
      renderKeywordCloud();

      // Render Recommendations
      renderRecommendations();

      // Render History
      renderHistory();
    }

    function renderTypeBars() {
      const container = document.getElementById('typeBars');
      const total = state.preferences.totalCount;
      const typeStats = state.preferences.typeStats;

      if (total === 0) {
        container.innerHTML = '<div class="empty-cloud">暂无数据</div>';
        return;
      }

      const types = [
        { key: 'image', label: '🖼️ 图片', class: 'image' },
        { key: 'music', label: '🎵 音乐', class: 'music' },
        { key: 'tts', label: '🎤 语音', class: 'tts' }
      ];

      container.innerHTML = types.map(t => {
        const count = typeStats[t.key] || 0;
        const percent = total > 0 ? Math.round((count / total) * 100) : 0;
        return `
          <div class="type-bar-item">
            <span class="type-bar-label">${t.label}</span>
            <div class="type-bar-track">
              <div class="type-bar-fill ${t.class}" style="width: ${percent}%"></div>
            </div>
            <span class="type-bar-value">${percent}%</span>
          </div>
        `;
      }).join('');
    }

    function renderKeywordCloud() {
      const container = document.getElementById('keywordCloud');
      const keywords = state.preferences.topKeywords;

      if (keywords.length === 0) {
        container.innerHTML = '<div class="empty-cloud">暂无主题数据，开始创作后会分析你的偏好</div>';
        return;
      }

      // 计算字体大小等级
      const maxCount = keywords[0]?.count || 1;
      const minCount = keywords[keywords.length - 1]?.count || 1;
      const range = maxCount - minCount || 1;

      container.innerHTML = keywords.map(k => {
        let sizeClass = 'size-small';
        if (range > 0) {
          const ratio = (k.count - minCount) / range;
          if (ratio > 0.6) sizeClass = 'size-large';
          else if (ratio > 0.3) sizeClass = 'size-medium';
        }
        return `<span class="keyword-tag ${sizeClass}" onclick="useKeyword('${k.keyword}')">${k.keyword} (${k.count})</span>`;
      }).join('');
    }

    function renderRecommendations() {
      const container = document.getElementById('recommendList');
      const recommendations = state.recommendations;

      if (recommendations.length === 0) {
        container.innerHTML = '<div class="empty-cloud">暂无推荐</div>';
        return;
      }

      container.innerHTML = recommendations.map(r => `
        <div class="recommend-item" onclick="useRecommendation('${encodeURIComponent(r.prompt)}', '${r.type}')">
          <div class="recommend-icon ${r.type}">
            ${r.type === 'music' ? '🎵' : r.type === 'tts' ? '🎤' : '🖼️'}
          </div>
          <div class="recommend-content">
            <div class="recommend-prompt">${r.prompt}</div>
            <div class="recommend-reason">${r.reason}</div>
          </div>
        </div>
      `).join('');
    }

    function renderHistory() {
      const container = document.getElementById('historyList');
      const generations = state.recentGenerations;

      if (generations.length === 0) {
        container.innerHTML = '<div class="empty-cloud">暂无创作记录</div>';
        return;
      }

      container.innerHTML = generations.map(g => {
        const typeIcon = g.type === 'music' ? '🎵' : g.type === 'tts' ? '🎤' : '🖼️';
        const typeClass = g.type;
        const tags = (g.tags || []).slice(0, 3);
        
        return `
          <div class="history-item">
            <div class="history-type-icon ${typeClass}">${typeIcon}</div>
            <div class="history-content">
              <div class="history-prompt">${g.prompt || '无描述'}</div>
              <div class="history-time">${g.date || new Date(g.timestamp).toLocaleString('zh-CN')}</div>
              ${tags.length > 0 ? `
                <div class="history-tags">
                  ${tags.map(t => `<span class="history-tag">${t}</span>`).join('')}
                </div>
              ` : ''}
            </div>
            <span class="history-delete" onclick="event.stopPropagation();deleteHistory('${g.id}')">×</span>
          </div>
        `;
      }).join('');
    }

    function showEmpty() {
      document.getElementById('loadingView').style.display = 'none';
      document.getElementById('contentView').style.display = 'none';
      document.getElementById('emptyView').style.display = 'block';
    }

    function goToGenerate() {
      window.location.hash = '/pages/generate.html?type=image';
    }

    function useKeyword(keyword) {
      window.location.hash = '/pages/generate.html?type=image&prompt=' + encodeURIComponent(keyword);
    }

    function useRecommendation(prompt, type) {
      window.location.hash = '/pages/generate.html?type=' + type + '&prompt=' + prompt;
    }

    async function deleteHistory(id) {
      if (!confirm('确定要删除这条记录吗？')) return;
      
      try {
        await window.MemoryService.deleteGeneration(id);
        showToast('已删除', 'success');
        await loadMemoryData();
      } catch (e) {
        console.error('删除失败:', e);
        showToast('删除失败', 'error');
      }
    }

    async function onClearMemory() {
      if (state.preferences.totalCount === 0) {
        showToast('暂无数据', 'info');
        return;
      }
      
      if (!confirm('确定要清除所有记忆吗？此操作不可恢复。')) return;
      
      try {
        await window.MemoryService.clearAllMemory();
        showToast('记忆已清除', 'success');
        await loadMemoryData();
      } catch (e) {
        console.error('清除失败:', e);
        showToast('清除失败', 'error');
      }
    }
  </script>
</body>
</html>
