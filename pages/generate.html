<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Creator - 生成</title>
  <style>
    .page {
      padding: 16px;
      min-height: 100vh;
      background: #f5f5f5;
      padding-bottom: 80px;
    }

    /* Result Container */
    .result-container {
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-image {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .revised-prompt {
      padding: 8px 12px;
      background: #f0f4ff;
      border-radius: 8px;
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .revised-prompt .label {
      color: #1A73E8;
      font-weight: 500;
    }

    .result-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .btn-action {
      flex: 1;
      padding: 12px 0;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      color: #333;
      cursor: pointer;
    }

    /* Music Result */
    .music-result {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 12px;
    }

    .music-cover {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cover-placeholder {
      font-size: 32px;
    }

    .music-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .music-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .music-desc {
      font-size: 12px;
      color: #999;
    }

    .btn-play {
      width: 80px;
      padding: 8px 0;
      background: #1A73E8;
      color: #fff;
      border-radius: 16px;
      font-size: 14px;
      border: none;
      cursor: pointer;
    }

    .lyrics-section {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .lyrics-text {
      font-size: 13px;
      color: #666;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    /* TTS Result */
    .tts-result {
      background: #fff;
      border-radius: 12px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .tts-icon {
      font-size: 40px;
    }

    .tts-text {
      font-size: 14px;
      color: #666;
      text-align: center;
      line-height: 1.6;
    }

    /* Form Card */
    .form-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .type-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .credits-info {
      font-size: 12px;
      color: #1A73E8;
      font-weight: 400;
    }

    .prompt-input {
      width: 100%;
      min-height: 100px;
      padding: 12px;
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      box-sizing: border-box;
      margin-bottom: 12px;
      resize: vertical;
    }

    .param-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .param-label {
      font-size: 14px;
      color: #666;
    }

    .param-select {
      font-size: 14px;
      color: #1A73E8;
      padding: 4px 0;
      appearance: none;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .error-tip {
      padding: 8px 12px;
      background: #fff0f0;
      border-radius: 6px;
      color: #e53e3e;
      font-size: 13px;
      margin: 8px 0;
    }

    .btn-generate {
      width: 100%;
      padding: 14px 0;
      background: linear-gradient(135deg, #1A73E8, #4facfe);
      color: #fff;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 500;
      border: none;
      margin-top: 16px;
      cursor: pointer;
    }

    .btn-generate.disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-back {
      display: inline-block;
      margin-bottom: 12px;
      color: #1A73E8;
      font-size: 14px;
      cursor: pointer;
    }

    /* Template Button */
    .template-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      background: #f0f4ff;
      border: 1px solid #d0d9ff;
      border-radius: 16px;
      font-size: 12px;
      color: #1A73E8;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .template-btn:active {
      background: #dce5ff;
    }

    /* Batch Mode */
    .batch-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 16px;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      margin-left: 8px;
    }

    .batch-toggle.active {
      background: #e8f0ff;
      border-color: #1A73E8;
      color: #1A73E8;
    }

    .batch-controls {
      display: none;
      margin-bottom: 12px;
      padding: 12px;
      background: #f9f9f9;
      border-radius: 8px;
    }

    .batch-controls.visible {
      display: block;
    }

    .batch-size-label {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    .batch-size-btns {
      display: flex;
      gap: 8px;
    }

    .batch-size-btn {
      flex: 1;
      padding: 8px 0;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 13px;
      color: #666;
      cursor: pointer;
    }

    .batch-size-btn.selected {
      background: #1A73E8;
      border-color: #1A73E8;
      color: #fff;
    }

    .batch-prompt-tip {
      font-size: 11px;
      color: #999;
      margin-top: 8px;
    }

    /* Batch Results */
    .batch-result-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .batch-result-item {
      position: relative;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      padding-bottom: 12px;
    }

    .batch-result-item.failed {
      background: #fff0f0;
    }

    .batch-result-item img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
    }

    .batch-result-item .item-index {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .batch-result-item .item-failed-msg {
      font-size: 11px;
      color: #e53e3e;
      padding: 8px;
      text-align: center;
    }

    .batch-result-music {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 12px;
    }

    .batch-result-music.failed {
      background: #fff0f0;
    }

    .batch-result-tts {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .batch-result-tts.failed {
      background: #fff0f0;
    }

    .batch-progress {
      margin-bottom: 12px;
      padding: 12px;
      background: #f0f4ff;
      border-radius: 8px;
      font-size: 13px;
      color: #1A73E8;
      text-align: center;
    }

    .batch-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn-back-batch {
      display: inline-block;
      margin-bottom: 12px;
      color: #666;
      font-size: 14px;
      cursor: pointer;
    }

    /* Template Panel Overlay */
    .template-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }

    .template-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* Template Panel */
    .template-panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 60vh;
      background: #fff;
      border-radius: 16px 16px 0 0;
      z-index: 1000;
      transform: translateY(100%);
      transition: transform 0.3s ease-out;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .template-panel.active {
      transform: translateY(0);
    }

    .template-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid #f0f0f0;
      flex-shrink: 0;
    }

    .template-panel-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .template-panel-close {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f5f5f5;
      border: none;
      font-size: 18px;
      color: #666;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .template-panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 24px;
    }

    .template-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .template-card {
      background: #f9f9f9;
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .template-card:active {
      background: #f0f4ff;
      border-color: #1A73E8;
    }

    .template-card-name {
      font-size: 14px;
      font-weight: 500;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .template-card-desc {
      font-size: 11px;
      color: #999;
      margin-bottom: 6px;
    }

    .template-card-prompt {
      font-size: 11px;
      color: #666;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* Export Dropdown */
    .export-menu {
      position: relative;
      display: inline-block;
    }

    .export-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      min-width: 140px;
      z-index: 100;
      display: none;
      overflow: hidden;
    }

    .export-dropdown.active {
      display: block;
    }

    .export-item {
      padding: 12px 16px;
      font-size: 14px;
      color: #333;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .export-item:active {
      background: #f5f5f5;
    }

    /* Progress Bar */
    .progress-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .progress-box {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      width: 280px;
      text-align: center;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #f0f0f0;
      border-radius: 4px;
      overflow: hidden;
      margin: 16px 0;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(135deg, #1A73E8, #4facfe);
      border-radius: 4px;
      transition: width 0.3s;
    }

    .progress-text {
      font-size: 14px;
      color: #666;
    }

    /* Memory Recommendation Section */
    .memory-recommend-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: linear-gradient(135deg, #f0f4ff, #e8f0ff);
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .memory-recommend-title {
      font-size: 13px;
      font-weight: 500;
      color: #1A73E8;
    }

    .memory-recommend-toggle {
      font-size: 10px;
      color: #1A73E8;
    }

    .memory-recommend-content {
      display: none;
    }

    .memory-recommend-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .memory-recommend-item:active {
      background: #f0f4ff;
    }

    .memory-recommend-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: linear-gradient(135deg, #1A73E8, #4facfe);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .memory-recommend-text {
      flex: 1;
      min-width: 0;
    }

    .memory-recommend-prompt {
      font-size: 12px;
      color: #333;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .memory-recommend-reason {
      font-size: 10px;
      color: #999;
      margin-top: 2px;
    }

    /* Role Selector */
    .role-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: linear-gradient(135deg, #f0f4ff, #e8f0ff);
      border: 1px solid #d0d9ff;
      border-radius: 20px;
      font-size: 13px;
      color: #1A73E8;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .role-selector:active {
      background: linear-gradient(135deg, #e8f0ff, #dce5ff);
    }

    .role-arrow {
      font-size: 10px;
      opacity: 0.7;
    }

    .role-option.selected {
      background: #e8f0ff !important;
      border: 2px solid #1A73E8 !important;
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- Offline Status Banner -->
    <div id="offlineBanner" class="offline-banner" style="display:none;">
      <span class="offline-icon">📡</span>
      <span class="offline-text" id="offlineText">离线模式</span>
      <span class="offline-queue" id="queueBadge" style="display:none;">0 个待提交</span>
    </div>

    <span class="btn-back" onclick="window.history.back()">← 返回</span>

    <!-- Result View -->
    <div id="resultView" style="display:none;"></div>

    <!-- Form View -->
    <div id="formView">
      <div class="form-card">
        <div class="type-label">
          <span id="typeLabel">🖼️ 图片生成</span>
          <span class="credits-info" id="creditsInfo">剩余 0 积分</span>
        </div>

        <button class="role-selector" id="roleSelector" onclick="openRoleSelector()">
          <span id="roleSelectorIcon">🎭</span>
          <span id="roleSelectorName">选择角色</span>
          <span class="role-arrow">▼</span>
        </button>

        <button class="template-btn" id="templateBtn" onclick="openTemplatePanel()">
          📋 模板中心
        </button>
        <button class="batch-toggle" id="batchToggle" onclick="toggleBatchMode()">
          📦 批量
        </button>

        <div class="batch-controls" id="batchControls">
          <div class="batch-size-label">生成数量</div>
          <div class="batch-size-btns">
            <button class="batch-size-btn" data-size="3" onclick="selectBatchSize(3)">3张</button>
            <button class="batch-size-btn selected" data-size="5" onclick="selectBatchSize(5)">5张</button>
            <button class="batch-size-btn" data-size="10" onclick="selectBatchSize(10)">10张</button>
          </div>
          <div class="batch-prompt-tip" id="batchPromptTip">每行一个描述，最多生成10张</div>
        </div>

        <textarea
          id="promptInput"
          class="prompt-input"
          placeholder="描述你想要的图片，例如：一只穿西装的猫在弹钢琴"
          maxlength="2000"
        ></textarea>

        <!-- Image Params -->
        <div id="imageParams">
          <div class="param-section">
            <span class="param-label">风格</span>
            <select id="styleSelect" class="param-select">
              <option value="vivid">写实</option>
              <option value="natural">自然</option>
            </select>
          </div>
          <div class="param-section">
            <span class="param-label">比例</span>
            <select id="sizeSelect" class="param-select">
              <option value="1024x1024">1:1</option>
              <option value="1024x1792">9:16</option>
              <option value="1792x1024">16:9</option>
            </select>
          </div>
        </div>

        <!-- Music Params -->
        <div id="musicParams" style="display:none;">
          <div class="param-section">
            <span class="param-label">风格</span>
            <select id="genreSelect" class="param-select">
              <option value="pop">流行</option>
              <option value="rock">摇滚</option>
              <option value="jazz">爵士</option>
              <option value="classical">古典</option>
              <option value="electronic">电子</option>
              <option value="folk">民谣</option>
            </select>
          </div>
          <div class="param-section">
            <span class="param-label">时长</span>
            <select id="durationSelect" class="param-select">
              <option value="30">30秒</option>
              <option value="60">60秒</option>
              <option value="120">2分钟</option>
              <option value="180">3分钟</option>
            </select>
          </div>
        </div>

        <!-- TTS Params -->
        <div id="ttsParams" style="display:none;">
          <div class="param-section">
            <span class="param-label">音色</span>
            <select id="voiceSelect" class="param-select">
              <option value="female-shaonv">少女声音</option>
              <option value="male-qn-qingse">青年男声</option>
              <option value="female-yujie">御姐声音</option>
              <option value="male-qn-jingxing">激情男声</option>
            </select>
          </div>
        </div>

        <div id="errorTip" class="error-tip" style="display:none;"></div>

        <button id="generateBtn" class="btn-generate" onclick="onGenerate()">
          🚀 开始生成
        </button>

        <!-- Memory Recommendation Section -->
        <div id="memoryRecommendSection" style="display:none; margin-top: 16px;">
          <div class="memory-recommend-header" onclick="toggleMemoryRecommend()">
            <span class="memory-recommend-title">💡 基于你的偏好</span>
            <span class="memory-recommend-toggle" id="memoryRecommendToggle">▼</span>
          </div>
          <div class="memory-recommend-content" id="memoryRecommendContent"></div>
        </div>
      </div>
    </div>

    <!-- Audio element for TTS playback -->
    <audio id="ttsAudio" style="display:none;"></audio>

    <!-- Template Panel -->
    <div class="template-overlay" id="templateOverlay" onclick="closeTemplatePanel()"></div>
    <div class="template-panel" id="templatePanel">
      <div class="template-panel-header">
        <span class="template-panel-title">📋 选择模板</span>
        <button class="template-panel-close" onclick="closeTemplatePanel()">×</button>
      </div>
      <div class="template-panel-content">
        <div class="template-grid" id="templateGrid"></div>
      </div>
    </div>

    <!-- Progress Overlay for ZIP -->
    <div class="progress-overlay" id="progressOverlay" style="display:none;">
      <div class="progress-box">
        <div class="progress-text" id="progressText">准备中...</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <div class="progress-text" id="progressCount">0/0</div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      type: 'image',
      prompt: '',
      imageStyle: 'vivid',
      imageSize: '1024x1024',
      musicGenre: 'pop',
      musicDuration: 60,
      ttsVoice: 'female-shaonj',
      isGenerating: false,
      result: null,
      batchMode: false,
      batchSize: 5,
      batchResults: [],
      batchProgress: 0,
      selectedRole: localStorage.getItem('selected_role') || null,
    };

    // Role mapping for each creation type
    const roleTypeMap = {
      image: ['illustrator', 'designer'],
      music: ['musician'],
      tts: ['voiceActor']
    };

    const typeLabels = {
      image: '🖼️ 图片生成',
      music: '🎵 音乐生成',
      tts: '🎤 语音合成',
    };

    const placeholders = {
      image: '描述你想要的图片，例如：一只穿西装的猫在弹钢琴',
      music: '描述你想要的音乐风格，例如：欢快的夏日海滩派对音乐',
      tts: '输入要转换的文字内容',
    };

    const batchPromptTips = {
      image: '每行一个描述，最多生成10张',
      music: '每行一个描述，最多生成5首',

    // ========== Offline Queue Functions ==========
    function updateOfflineStatus() {
      const banner = document.getElementById('offlineBanner');
      const offlineText = document.getElementById('offlineText');
      const queueBadge = document.getElementById('queueBadge');

      if (!navigator.onLine) {
        banner.style.display = 'flex';
        offlineText.textContent = '离线模式 - 请求已加入队列';
        banner.classList.add('offline');
      } else {
        banner.style.display = 'flex';
        offlineText.textContent = '🌐 在线';
        banner.classList.remove('offline');
        // Hide after 2 seconds when online
        setTimeout(() => {
          banner.style.display = 'none';
        }, 2000);
      }
    }

    async function updateQueueBadge() {
      const badge = document.getElementById('queueBadge');
      if (!window.OfflineQueue) {
        badge.style.display = 'none';
        return;
      }

      try {
        const status = await window.OfflineQueue.getQueueStatus();
        if (status.pending > 0) {
          badge.style.display = 'inline';
          badge.textContent = `${status.pending} 个待提交`;
        } else {
          badge.style.display = 'none';
        }
      } catch (e) {
        badge.style.display = 'none';
      }
    }

    async function handleOfflineRequest(prompts) {
      if (!window.OfflineQueue) {
        showError('离线队列服务不可用，请检查网络');
        return;
      }

      const btn = document.getElementById('generateBtn');

      try {
        for (const prompt of prompts) {
          let params = {};
          if (state.type === 'image') {
            params = {
              style: document.getElementById('styleSelect').value,
              size: document.getElementById('sizeSelect').value
            };
          } else if (state.type === 'music') {
            params = {
              genre: document.getElementById('genreSelect').value,
              duration: parseInt(document.getElementById('durationSelect').value)
            };
          } else if (state.type === 'tts') {
            params = {
              voice: document.getElementById('voiceSelect').value
            };
          }

          await window.OfflineQueue.addToQueue({
            type: state.type,
            prompt: prompt,
            params: params
          });
        }

        // Show success message
        showToast(`已加入离线队列，网络恢复后将自动提交`, 'success');

        // Update UI
        updateOfflineStatus();
        updateQueueBadge();

        // Clear input
        document.getElementById('promptInput').value = '';

      } catch (e) {
        console.error('Add to queue error:', e);
        showError('加入队列失败: ' + e.message);
      }
    }

    // Setup offline status listeners
    function setupOfflineListeners() {
      window.addEventListener('online', () => {
        updateOfflineStatus();
        updateQueueBadge();
      });

      window.addEventListener('offline', () => {
        updateOfflineStatus();
      });

      // Listen for queue processing events
      window.addEventListener('offlineQueue:processed', (e) => {
        const { processed, failed } = e.detail;
        showToast(`队列处理完成: ${processed}个成功${failed > 0 ? `, ${failed}个失败` : ''}`, processed > 0 ? 'success' : 'warning');
        updateQueueBadge();
      });

      window.addEventListener('offlineQueue:statusChange', (e) => {
        updateOfflineStatus();
      });

      // Initial status update
      updateOfflineStatus();
      updateQueueBadge();
    }

    // 显示质量评估面板
    async function showQualityAssessment(result, type) {
      try {
        const { QualityService } = await import('../services/qualityService.js');
        let evaluation;
        
        if (type === 'image') {
          evaluation = await QualityService.evaluateImage({
            url: result.url,
            revised_prompt: result.revised_prompt,
            style: document.getElementById('styleSelect')?.value || 'vivid',
            size: document.getElementById('sizeSelect')?.value || '1024x1024',
            prompt: document.getElementById('promptInput')?.value || ''
          });
        } else if (type === 'music') {
          evaluation = await QualityService.evaluateMusic({
            musicUrl: result.musicUrl,
            duration: result.duration || 60,
            genre: document.getElementById('genreSelect')?.value || 'pop',
            lyrics: result.lyrics || '',
            prompt: document.getElementById('promptInput')?.value || ''
          });
        } else if (type === 'tts') {
          const promptText = document.getElementById('promptInput')?.value || '';
          evaluation = await QualityService.evaluateTTS({
            filePath: result.filePath,
            voice: document.getElementById('voiceSelect')?.value || 'female-shaonv',
            text: promptText,
            charCount: promptText.length
          });
        }
        
        if (evaluation) {
          const qualityHTML = buildQualityPanelHTML(evaluation);
          const container = document.getElementById('resultView');
          const resultContainer = container.querySelector('.result-container');
          if (resultContainer) {
            resultContainer.insertAdjacentHTML('beforebegin', qualityHTML);
          }
        }
      } catch (e) {
        console.error('质量评估失败:', e);
      }
    }
    
    // 构建质量评估面板HTML
    function buildQualityPanelHTML(evaluation) {
      const { score, metrics, percentile, suggestions, summary, type, benchmark, improvements, promptOptimization } = evaluation;
      const level = score >= 90 ? 'S' : score >= 80 ? 'A' : score >= 70 ? 'B' : score >= 60 ? 'C' : 'D';
      const levelClass = level.toLowerCase() + '-rank';
      
      const typeIcons = { image: '🖼️', music: '🎵', tts: '🎤' };
      
      // 行业基准对比信息
      const benchmarkLevelClass = benchmark ? benchmark.level : 'average';
      const benchmarkIcon = benchmarkLevelClass === 'excellent' ? '🌟' : 
                            benchmarkLevelClass === 'good' ? '👍' : 
                            benchmarkLevelClass === 'average' ? '📊' : 
                            benchmarkLevelClass === 'below' ? '📈' : '💪';
      
      let benchmarkHTML = '';
      if (benchmark) {
        const diffSign = benchmark.difference >= 0 ? '+' : '';
        benchmarkHTML = `
          <div class="quality-benchmark">
            <div class="quality-benchmark-bar">
              <div class="quality-benchmark-avg" style="left: ${benchmark.benchmarkAvg}%;"></div>
              <div class="quality-benchmark-user" style="left: ${score}%;"></div>
            </div>
            <div class="quality-benchmark-labels">
              <span>行业平均: ${benchmark.benchmarkAvg}</span>
              <span class="quality-benchmark-comparison ${benchmarkLevelClass}">${benchmarkIcon} ${benchmark.comparison} (${diffSign}${benchmark.difference})</span>
              <span>您的得分: ${score}</span>
            </div>
          </div>
        `;
      }
      
      // 百分位排名徽章
      const percentileBadge = percentile >= 90 ? '👑' : percentile >= 75 ? '🏆' : percentile >= 50 ? '👍' : '💡';
      
      let metricsHTML = '';
      for (const [key, metric] of Object.entries(metrics)) {
        const fillClass = metric.score >= 85 ? 'excellent' : metric.score >= 70 ? 'good' : metric.score >= 50 ? 'average' : 'poor';
        const icon = metric.score >= 70 ? '✅' : '💡';
        metricsHTML += `
          <div class="quality-metric-item">
            <div class="quality-metric-header">
              <span class="quality-metric-label">${icon} ${metric.label}</span>
              <span class="quality-metric-score">${metric.score}分</span>
            </div>
            <div class="quality-metric-bar">
              <div class="quality-metric-fill ${fillClass}" style="width: ${metric.score}%;"></div>
            </div>
          </div>
        `;
      }
      
      let suggestionsHTML = '';
      for (const suggestion of suggestions) {
        const isPositive = suggestion.includes('优秀') || suggestion.includes('良好') || suggestion.includes('不错');
        suggestionsHTML += `
          <li class="quality-suggestion-item">
            <span class="quality-suggestion-icon ${isPositive ? 'good' : 'improve'}">${isPositive ? '✨' : '💡'}</span>
            <span>${suggestion}</span>
          </li>
        `;
      }
      
      // 分维度改进建议
      let improvementsHTML = '';
      if (improvements && improvements.length > 0) {
        improvementsHTML = `
          <div class="quality-improvements">
            <div class="quality-improvements-title">🎯 分维度改进建议</div>
            <ul class="quality-improvements-list">
              ${improvements.map(imp => `
                <li class="quality-improvement-item ${imp.priority === 'high' ? 'high-priority' : ''}" data-tip="${imp.tip}">
                  <span class="quality-improvement-dim">${imp.dimension}</span>
                  <span class="quality-improvement-score">${imp.score}分</span>
                  <span class="quality-improvement-tip">💡 ${imp.tip}</span>
                </li>
              `).join('')}
            </ul>
          </div>
        `;
      }
      
      // Prompt优化建议
      let promptOptHTML = '';
      if (promptOptimization && promptOptimization.tips && promptOptimization.tips.length > 0) {
        promptOptHTML = `
          <div class="quality-prompt-opt">
            <div class="quality-prompt-opt-title">✨ Prompt优化建议</div>
            <ul class="quality-prompt-opt-list">
              ${promptOptimization.tips.map(tip => `
                <li class="quality-prompt-opt-item ${tip.type}">
                  <span class="quality-prompt-opt-icon">${tip.type === 'success' ? '✅' : tip.type === 'add' ? '➕' : '💬'}</span>
                  <span class="quality-prompt-opt-text">${tip.text}</span>
                  ${tip.examples ? `<div class="quality-prompt-opt-examples">示例: ${tip.examples.join(', ')}</div>` : ''}
                </li>
              `).join('')}
            </ul>
          </div>
        `;
      }
      
      return `
        <div class="quality-panel" id="qualityPanel">
          <div class="quality-panel-header">
            <div class="quality-panel-title">
              ${typeIcons[type] || '📊'} 质量评估
              <span class="quality-level-badge ${levelClass}">${level}</span>
            </div>
            <div class="quality-score-circle">
              <span class="quality-score-value">${score}</span>
              <span class="quality-score-label">质量分</span>
            </div>
          </div>
          <div class="quality-percentile">
            <span class="quality-percentile-icon">${percentileBadge}</span>
            <span class="quality-percentile-text">超过了 <span class="quality-percentile-value">${percentile}%</span> 的创作</span>
          </div>
          ${benchmarkHTML}
          <div class="quality-summary">${summary}</div>
          <div class="quality-metrics">
            ${metricsHTML}
          </div>
          ${improvementsHTML}
          ${promptOptHTML}
          <div class="quality-suggestions">
            <div class="quality-suggestions-title">💬 优化建议</div>
            <ul class="quality-suggestions-list">
              ${suggestionsHTML}
            </ul>
          </div>
        </div>
      `;
    }

    async function onGenerate() {
      const prompt = document.getElementById('promptInput').value.trim();
      if (!prompt) { showError('请输入内容描述'); return; }
      clearError();

      // Parse prompts based on mode
      let prompts = [];
      if (state.batchMode) {
        if (state.type === 'tts') {
          // TTS: split by empty lines
          prompts = prompt.split(/\n\s*\n/).map(p => p.trim()).filter(p => p);
        } else {
          // Image/Music: split by newlines
          prompts = prompt.split('\n').map(p => p.trim()).filter(p => p);
        }
        const maxBatch = state.type === 'music' ? 5 : 10;
        if (prompts.length > maxBatch) {
          showError(`批量数量不能超过${maxBatch}个`);
          return;
        }
        if (prompts.length === 0) {
          showError('请输入有效的生成内容');
          return;
        }
      } else {
        prompts = [prompt];
      }

      if (!contentModeration(prompt)) {
        showError('输入内容包含敏感词，请修改后重试');
        return;
      }

      const app = getApp();
      if (Number(app.globalData.credits) <= 0) {
        showModal({
          title: '积分不足',
          content: '您的积分不足，请先充值',
          confirmText: '充值',
        }).then(res => { if (res.confirm) window.location.hash = '/pages/my.html'; });
        return;
      }

      // Check if offline - add to queue instead of generating directly
      if (!navigator.onLine) {
        await handleOfflineRequest(prompts);
        return;
      }

      state.isGenerating = true;
      const btn = document.getElementById('generateBtn');
      btn.textContent = state.batchMode ? '批量生成中...' : '生成中...';
      btn.classList.add('disabled');

      try {
        let result;
        if (state.type === 'image') {
          if (state.batchMode) {
            result = await doBatchGenerateImage(prompts);
          } else {
            result = await doGenerateImage(prompt);
          }
        } else if (state.type === 'music') {
          if (state.batchMode) {
            result = await doBatchGenerateMusic(prompts);
          } else {
            result = await doGenerateMusic(prompt);
          }
        } else if (state.type === 'tts') {
          if (state.batchMode) {
            result = await doBatchGenerateTTS(prompts);
          } else {
            result = await doGenerateTTS(prompt);
          }
        }
        if (state.batchMode) {
          showBatchResults(result);
        } else {
          showResult(result);
        }
      } catch (e) {
        showError(e.message || '生成失败');
      } finally {
        state.isGenerating = false;
        btn.textContent = '🚀 开始生成';
        btn.classList.remove('disabled');
        refreshCredits();
      }
    }

    // Get role prompt prefix for current selected role
    function getRolePromptPrefix() {
      const selectedRole = localStorage.getItem('selected_role');
      if (!selectedRole) return '';
      
      const rolePrefixes = {
        illustrator: 'As a professional AI illustrator with expertise in creating stunning visual artwork, I specialize in detailed illustration, character design, and artistic composition. Create a beautiful, professionally crafted illustration with careful attention to lighting, color harmony, and artistic detail. ',
        musician: 'As a professional AI music composer and producer, I create original music with sophisticated arrangements, melismatic melodies, and professional audio production quality. Compose an original musical piece with excellent melody, harmony, rhythm, and production value. ',
        voiceActor: 'As a professional AI voice actor and voice synthesis specialist, I create natural, expressive, and emotionally resonant speech with professional vocal quality, proper diction, and authentic emotional delivery. ',
        designer: 'As a professional AI designer specializing in visual communication and design aesthetics, I create stunning, professional designs with excellent composition, color theory, typography, and modern design principles. '
      };
      
      return rolePrefixes[selectedRole] || '';
    }

    async function doGenerateImage(prompt) {
      showLoading('AI 创作中...');
      try {
        // Prepend role prompt prefix if role is selected
        const rolePrefix = getRolePromptPrefix();
        const enhancedPrompt = rolePrefix + prompt;
        
        const { generateImage, saveImageHistory } = await import('../services/imageService.js');
        const { recordImageGenerated, checkAndUnlockAchievements, showNewAchievements } = await import('../services/achievementService.js');
        const style = document.getElementById('styleSelect').value;
        const size = document.getElementById('sizeSelect').value;
        const res = await generateImage({ prompt: enhancedPrompt, style, size });
        const url = res.data?.[0]?.url;
        if (!url) throw new Error('未获取到生成结果');
        saveImageHistory({ prompt, url, style, size });
        recordImageGenerated(style, size);
        const { recordUsage } = await import('../services/usageService.js');
        recordUsage('image', { model: 'image-01', size });
        const newAchievements = checkAndUnlockAchievements();
        if (newAchievements.length > 0) showNewAchievements(newAchievements);
        getApp().updateCredits(-1);
        
        // 记录到记忆系统
        try {
          const MemoryService = window.MemoryService || (await import('../services/memoryService.js')).MemoryService;
          await MemoryService.recordGeneration('image', prompt, [], { style, size });
        } catch (e) {
          console.error('记录到记忆失败:', e);
        }
        
        return { url, revised_prompt: res.data?.[0]?.revised_prompt };
      } finally {
        hideLoading();
      }
    }

    async function doGenerateMusic(prompt) {
      showLoading('音乐生成中（可能需要30-60秒）...');
      try {
        // Prepend role prompt prefix if role is selected
        const rolePrefix = getRolePromptPrefix();
        const enhancedPrompt = rolePrefix + prompt;
        
        const { generateFullMusic, saveMusicHistory } = await import('../services/musicService.js');
        const { recordMusicGenerated, checkAndUnlockAchievements, showNewAchievements } = await import('../services/achievementService.js');
        const genre = document.getElementById('genreSelect').value;
        const duration = parseInt(document.getElementById('durationSelect').value);
        const res = await generateFullMusic({ prompt: enhancedPrompt, genre, duration });
        saveMusicHistory({
          prompt,
          musicUrl: res.musicUrl,
          coverUrl: res.coverUrl,
          lyrics: res.lyrics,
          duration: res.duration,
        });
        recordMusicGenerated(res.duration || duration);
        const { recordUsage } = await import('../services/usageService.js');
        recordUsage('music', { model: 'music-2.6', duration: res.duration || duration });
        const newAchievements = checkAndUnlockAchievements();
        if (newAchievements.length > 0) showNewAchievements(newAchievements);
        getApp().updateCredits(-5);
        
        // 记录到记忆系统
        try {
          const MemoryService = window.MemoryService || (await import('../services/memoryService.js')).MemoryService;
          await MemoryService.recordGeneration('music', prompt, [], { genre, duration: res.duration || duration });
        } catch (e) {
          console.error('记录到记忆失败:', e);
        }
        
        return res;
      } finally {
        hideLoading();
      }
    }

    async function doGenerateTTS(prompt) {
      showLoading('语音合成中...');
      try {
        // Prepend role prompt prefix if role is selected
        const rolePrefix = getRolePromptPrefix();
        const enhancedPrompt = rolePrefix + prompt;
        
        const { generateSpeech, saveB64AudioAsDataUrl, saveTTSHistory } = await import('../services/ttsService.js');
        const { recordAudioGenerated, checkAndUnlockAchievements, showNewAchievements } = await import('../services/achievementService.js');
        const voice = document.getElementById('voiceSelect').value;
        const res = await generateSpeech({ input: enhancedPrompt, voice, format: 'mp3' });
        if (!res.b64_audio) throw new Error('未获取到音频数据');
        const dataUrl = saveB64AudioAsDataUrl(res.b64_audio, 'mp3');
        const voiceName = { 'female-shaonv': '少女声音', 'male-qn-qingse': '青年男声', 'female-yujie': '御姐声音', 'male-qn-jingxing': '激情男声' }[voice] || voice;
        saveTTSHistory({ input: prompt, voice, voiceName, filePath: dataUrl, format: 'mp3' });
        recordAudioGenerated();
        const { recordUsage } = await import('../services/usageService.js');
        recordUsage('tts', { model: 'TTS-HD', charCount: prompt.length });
        const newAchievements = checkAndUnlockAchievements();
        if (newAchievements.length > 0) showNewAchievements(newAchievements);
        getApp().updateCredits(-1);
        
        // 记录到记忆系统
        try {
          const MemoryService = window.MemoryService || (await import('../services/memoryService.js')).MemoryService;
          await MemoryService.recordGeneration('tts', prompt, [], { voice, voiceName });
        } catch (e) {
          console.error('记录到记忆失败:', e);
        }
        
        return { filePath: dataUrl };
      } finally {
        hideLoading();
      }
    }

    // Batch Generation Functions
    async function doBatchGenerateImage(prompts) {
      const { batchGenerateImages } = await import('../services/imageService.js');
      const { recordImageGenerated, checkAndUnlockAchievements, showNewAchievements } = await import('../services/achievementService.js');
      const style = document.getElementById('styleSelect').value;
      const size = document.getElementById('sizeSelect').value;
      const results = await batchGenerateImages(prompts, style, size, (progress) => {
        state.batchProgress = progress;
      });
      // Record achievements and deduct credits for successful results
      const successCount = results.filter(r => r.success).length;
      const { recordUsage: batchRecordUsage } = await import('../services/usageService.js');
      for (let i = 0; i < successCount; i++) {
        recordImageGenerated(style, size);
        batchRecordUsage('image', { model: 'image-01', size });
      }
      const newAchievements = checkAndUnlockAchievements();
      if (newAchievements.length > 0) showNewAchievements(newAchievements);
      getApp().updateCredits(-successCount);
      return results;
    }

    async function doBatchGenerateMusic(prompts) {
      const { batchGenerateMusic } = await import('../services/musicService.js');
      const { recordMusicGenerated, checkAndUnlockAchievements, showNewAchievements } = await import('../services/achievementService.js');
      const genre = document.getElementById('genreSelect').value;
      const duration = parseInt(document.getElementById('durationSelect').value);
      const results = await batchGenerateMusic(prompts, genre, duration, (progress) => {
        state.batchProgress = progress;
      });
      const successCount = results.filter(r => r.success).length;
      const { recordUsage: batchMusicRecordUsage } = await import('../services/usageService.js');
      for (let i = 0; i < successCount; i++) {
        recordMusicGenerated(duration);
        batchMusicRecordUsage('music', { model: 'music-2.6', duration });
      }
      const newAchievements = checkAndUnlockAchievements();
      if (newAchievements.length > 0) showNewAchievements(newAchievements);
      getApp().updateCredits(-successCount * 5);
      return results;
    }

    async function doBatchGenerateTTS(prompts) {
      const { batchGenerateSpeech, saveB64AudioAsDataUrl, saveTTSHistory } = await import('../services/ttsService.js');
      const { recordAudioGenerated, checkAndUnlockAchievements, showNewAchievements } = await import('../services/achievementService.js');
      const voice = document.getElementById('voiceSelect').value;
      const voiceName = { 'female-shaonv': '少女声音', 'male-qn-qingse': '青年男声', 'female-yujie': '御姐声音', 'male-qn-jingxing': '激情男声' }[voice] || voice;
      const results = await batchGenerateSpeech(prompts, voice, (progress) => {
        state.batchProgress = progress;
      });
      const successCount = results.filter(r => r.success).length;
      const { recordUsage: batchTTSRecordUsage } = await import('../services/usageService.js');
      for (let i = 0; i < successCount; i++) {
        recordAudioGenerated();
        batchTTSRecordUsage('tts', { model: 'TTS-HD', charCount: results[i].prompt?.length || 0 });
      }
      // Save successful results to history
      results.forEach(r => {
        if (r.success) {
          saveTTSHistory({ input: r.prompt, voice, voiceName, filePath: r.filePath, format: 'mp3' });
        }
      });
      const newAchievements = checkAndUnlockAchievements();
      if (newAchievements.length > 0) showNewAchievements(newAchievements);
      getApp().updateCredits(-successCount);
      return results;
    }

    function showBatchResults(results) {
      state.batchResults = results;
      document.getElementById('formView').style.display = 'none';
      const container = document.getElementById('resultView');
      container.style.display = 'block';

      const successCount = results.filter(r => r.success).length;
      const failCount = results.length - successCount;

      let html = `<span class="btn-back-batch" onclick="hideBatchResults()">← 返回</span>`;
      html += `<div class="batch-progress">已完成 ${successCount}/${results.length} 张${failCount > 0 ? `（${failCount}张失败）` : ''}</div>`;

      if (state.type === 'image') {
        html += '<div class="batch-result-grid">';
        results.forEach((r, i) => {
          if (r.success) {
            html += `
              <div class="batch-result-item">
                <span class="item-index">${i + 1}</span>
                <img src="${r.url}" onclick="previewImage(['${r.url}'])">
              </div>
            `;
          } else {
            html += `
              <div class="batch-result-item failed">
                <span class="item-index">${i + 1}</span>
                <div class="item-failed-msg">生成失败</div>
              </div>
            `;
          }
        });
        html += '</div>';
        html += '<div class="batch-actions"><button class="btn-action" onclick="onSaveAllImages()">💾 保存全部</button><button class="btn-action" onclick="hideBatchResults()">🔄 继续生成</button></div>';
      } else if (state.type === 'music') {
        results.forEach((r, i) => {
          if (r.success) {
            html += `
              <div class="batch-result-music">
                <div class="music-cover">
                  ${r.coverUrl ? `<img src="${r.coverUrl}" class="cover-img">` : '<span class="cover-placeholder">🎵</span>'}
                </div>
                <div class="music-info">
                  <span class="music-title">AI 创作音乐 ${i + 1}</span>
                  <span class="music-desc">时长：${r.duration}秒</span>
                  <button class="btn-play" onclick="playBatchMusic(${i})">▶ 播放</button>
                </div>
              </div>
            `;
          } else {
            html += `
              <div class="batch-result-music failed">
                <div class="music-info">
                  <span class="music-title">音乐 ${i + 1}</span>
                  <span class="music-desc">生成失败</span>
                </div>
              </div>
            `;
          }
        });
        html += '<div class="batch-actions"><button class="btn-action" onclick="hideBatchResults()">🔄 继续生成</button></div>';
      } else if (state.type === 'tts') {
        results.forEach((r, i) => {
          if (r.success) {
            html += `
              <div class="batch-result-tts">
                <span class="tts-text">${r.prompt.substring(0, 50)}${r.prompt.length > 50 ? '...' : ''}</span>
                <button class="btn-play" onclick="playBatchTTS(${i})">▶ 播放</button>
              </div>
            `;
          } else {
            html += `
              <div class="batch-result-tts failed">
                <span class="tts-text">${r.prompt.substring(0, 50)}${r.prompt.length > 50 ? '...' : ''}</span>
                <span style="color:#e53e3e;font-size:12px;display:block;margin-top:4px;">生成失败</span>
              </div>
            `;
          }
        });
        html += '<div class="batch-actions"><button class="btn-action" onclick="hideBatchResults()">🔄 继续生成</button></div>';
      }

      container.innerHTML = html;
    }

    function hideBatchResults() {
      document.getElementById('resultView').style.display = 'none';
      document.getElementById('formView').style.display = 'block';
      state.batchResults = [];
      state.batchProgress = 0;
    }

    function onSaveAllImages() {
      const successResults = state.batchResults.filter(r => r.success);
      successResults.forEach(r => saveImageToAlbum(r.url));
      showToast(`已保存${successResults.length}张图片`, 'success');
    }

    function playBatchMusic(index) {
      const result = state.batchResults[index];
      if (result && result.success) {
        const audio = document.getElementById('ttsAudio');
        audio.src = result.musicUrl;
        audio.play();
      }
    }

    function playBatchTTS(index) {
      const result = state.batchResults[index];
      if (result && result.success) {
        const audio = document.getElementById('ttsAudio');
        audio.src = result.filePath;
        audio.play();
      }
    }

    function playTTS() {
      if (state.result && state.result.filePath) {
        const audio = document.getElementById('ttsAudio');
        audio.src = state.result.filePath;
        audio.play();
      }
    }

    function playMusic() {
      if (state.result && state.result.musicUrl) {
        const audio = document.getElementById('ttsAudio');
        audio.src = state.result.musicUrl;
        audio.play();
      }
    }

    function closeSharePanel() {
      const overlay = document.getElementById('shareOverlay');
      const panel = document.getElementById('sharePanel');
      if (overlay) {
        overlay.classList.remove('active');
        setTimeout(() => {
          overlay.remove();
          document.body.style.overflow = '';
        }, 300);
      }
    }
    
    function doShareWechat() {
      if (!state.shareData) return;
      const result = ShareService.shareToWechat(state.shareData);
      showToast(result.message, result.success ? 'success' : 'error');
      closeSharePanel();
    }
    
    function doShareTwitter() {
      if (!state.shareData) return;
      ShareService.shareToTwitter(state.shareData);
      closeSharePanel();
    }
    
    function doShareTelegram() {
      if (!state.shareData) return;
      ShareService.shareToTelegram(state.shareData);
      closeSharePanel();
    }
    
    async function doCopyShareLink() {
      if (!state.shareData) return;
      const result = await ShareService.copyShareLink(state.shareData);
      showToast(result.message, result.success ? 'success' : 'error');
      closeSharePanel();
    }
    
    async function doCopyShareUrl() {
      const url = document.getElementById('shareShortUrl').value;
      try {
        await navigator.clipboard.writeText(url);
        showToast('链接已复制', 'success');
      } catch {
        const textarea = document.createElement('textarea');
        textarea.value = url;
        textarea.style.cssText = 'position:fixed;opacity:0;';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('链接已复制', 'success');
      }
    }

    // Export functions
    function toggleExportMenu() {
      const dropdown = document.getElementById('exportDropdown');
      if (dropdown) {
        dropdown.classList.toggle('active');
      }
    }

    // ========== Collab Functions ==========
    async function onCollabShare() {
      if (!state.result) return;
      
      // 动态加载协作服务
      const { CollabService } = await import('../services/collabService.js');
      
      // 准备作品数据
      const workData = {
        type: state.type,
        prompt: state.prompt || '',
        url: state.result.url || state.result.musicUrl || state.result.filePath || '',
        title: state.type === 'image' ? '🎨 AI 创作图片' : state.type === 'music' ? '🎵 AI 创作音乐' : '🎤 AI 语音合成',
        coverUrl: state.result.coverUrl || '',
        duration: state.result.duration || 0,
        style: state.result.style || '',
        size: state.result.size || ''
      };
      
      // 生成分享链接
      const shareResult = CollabService.shareWork(workData);
      state.shareId = shareResult.shareId;
      state.collabUrl = shareResult.shareUrl;
      
      // 显示协作面板
      showCollabPanel(shareResult);
    }
    
    function showCollabPanel(shareResult) {
      // 如果已存在面板则移除
      const existing = document.getElementById('collabPanel');
      if (existing) existing.remove();
      
      const overlay = document.createElement('div');
      overlay.id = 'collabOverlay';
      overlay.className = 'share-overlay';
      overlay.onclick = closeCollabPanel;
      
      const panel = document.createElement('div');
      panel.id = 'collabPanel';
      panel.className = 'share-panel collab-panel';
      
      panel.innerHTML = `
        <div class="share-panel-header">
          <span class="share-panel-title">🤝 协作分享</span>
          <button class="share-panel-close" onclick="closeCollabPanel()">×</button>
        </div>
        <div class="collab-panel-desc">分享链接给好友，他们可以查看并评论你的作品</div>
        <div class="collab-share-url">
          <input type="text" id="collabShareUrl" value="${shareResult.shareUrl}" readonly>
          <button class="share-url-copy-btn" onclick="copyCollabUrl()">复制</button>
        </div>
        <div class="collab-comments-section">
          <div class="collab-comments-title">💬 最近评论</div>
          <div class="collab-comments-list" id="collabCommentsList">
            ${renderCollabComments(shareResult.shareId)}
          </div>
        </div>
      `;
      
      overlay.appendChild(panel);
      document.body.appendChild(overlay);
      document.body.style.overflow = 'hidden';
      
      requestAnimationFrame(() => overlay.classList.add('active'));
      
      // 订阅实时更新
      if (state.collabUnsubscribe) {
        state.collabUnsubscribe();
      }
      state.collabUnsubscribe = CollabService.subscribeToUpdates((event) => {
        if (event.type === 'comment') {
          refreshCollabComments(shareResult.shareId);
        }
      });
    }
    
    function renderCollabComments(shareId) {
      const comments = CollabService.getComments(shareId);
      if (comments.length === 0) {
        return '<div class="collab-comments-empty">暂无评论，快来抢沙发吧</div>';
      }
      return comments.slice(0, 5).map(c => `
        <div class="collab-comment-item">
          <span class="collab-comment-author">${escapeHtml(c.author)}:</span>
          <span class="collab-comment-content">${escapeHtml(c.content)}</span>
        </div>
      `).join('');
    }
    
    function refreshCollabComments(shareId) {
      const list = document.getElementById('collabCommentsList');
      if (list) {
        list.innerHTML = renderCollabComments(shareId);
      }
    }
    
    function closeCollabPanel() {
      const overlay = document.getElementById('collabOverlay');
      const panel = document.getElementById('collabPanel');
      if (overlay) {
        overlay.classList.remove('active');
        setTimeout(() => {
          overlay.remove();
          document.body.style.overflow = '';
        }, 300);
      }
      if (state.collabUnsubscribe) {
        state.collabUnsubscribe();
        state.collabUnsubscribe = null;
      }
    }
    
    async function copyCollabUrl() {
      const url = document.getElementById('collabShareUrl').value;
      try {
        await navigator.clipboard.writeText(url);
        showToast('协作链接已复制', 'success');
      } catch {
        const textarea = document.createElement('textarea');
        textarea.value = url;
        textarea.style.cssText = 'position:fixed;opacity:0;';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('协作链接已复制', 'success');
      }
    }
    
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Close export menu when clicking outside
    document.addEventListener('click', function(e) {
      const dropdown = document.getElementById('exportDropdown');
      if (dropdown && !dropdown.classList.contains('active')) return;
      const exportMenus = document.querySelectorAll('.export-dropdown.active');
      exportMenus.forEach(menu => {
        if (!menu.parentElement.contains(e.target)) {
          menu.classList.remove('active');
        }
      });
    });

    async function onExportImage(format) {
      if (!state.result || !state.result.url) return;
      toggleExportMenu();
      
      try {
        showLoading('正在导出...');
        const imgUrl = state.result.url;
        
        // Convert to desired format
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.crossOrigin = 'anonymous';
        
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
          img.src = imgUrl;
        });
        
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        
        const mimeType = format === 'png' ? 'image/png' : 'image/jpeg';
        const quality = format === 'jpeg' ? 0.92 : undefined;
        const dataUrl = canvas.toDataURL(mimeType, quality);
        
        // Download
        const link = document.createElement('a');
        link.download = `ai-image-${Date.now()}.${format}`;
        link.href = dataUrl;
        link.click();
        
        hideLoading();
        showToast('已导出 ' + format.toUpperCase(), 'success');
      } catch (e) {
        hideLoading();
        showToast('导出失败', 'error');
        console.error(e);
      }
    }

    async function onExportMusic() {
      if (!state.result || !state.result.musicUrl) return;
      toggleExportMenu();
      
      try {
        const musicUrl = state.result.musicUrl;
        const link = document.createElement('a');
        link.download = `ai-music-${Date.now()}.mp3`;
        link.href = musicUrl;
        link.target = '_blank';
        link.click();
        showToast('已开始下载 MP3', 'success');
      } catch (e) {
        showToast('导出失败', 'error');
        console.error(e);
      }
    }

    async function onExportTTS() {
      if (!state.result || !state.result.filePath) return;
      toggleExportMenu();
      
      try {
        const audioUrl = state.result.filePath;
        const link = document.createElement('a');
        link.download = `ai-tts-${Date.now()}.mp3`;
        link.href = audioUrl;
        link.target = '_blank';
        link.click();
        showToast('已开始下载 MP3', 'success');
      } catch (e) {
        showToast('导出失败', 'error');
        console.error(e);
      }
    }

    async function onCopyLink() {
      toggleExportMenu();
      try {
        await navigator.clipboard.writeText(window.location.href);
        showToast('链接已复制', 'success');
      } catch (e) {
        // Fallback for older browsers
        const textarea = document.createElement('textarea');
        textarea.value = window.location.href;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('链接已复制', 'success');
      }
    }

    function onRegenerate() {
      hideResult();
    }

    // Favorite Functions
    async function onFavorite(type, url) {
      const folders = window.FavoriteService.getFolders();
      if (folders.length === 0) {
        showToast('请先创建收藏夹', 'error');
        return;
      }

      const itemId = 'img_' + Date.now();
      const prompt = state.prompt || '';

      // Show folder selection
      const folderNames = folders.map(f => f.name).join(', ');
      const folderId = folders[0].id; // Default to first folder

      window.FavoriteService.addToFolder(folderId, {
        itemId,
        type: 'image',
        url: url,
        prompt: prompt,
        cover: url,
        title: '图片 ' + new Date().toLocaleDateString(),
      });

      showToast('已收藏到' + folders[0].name, 'success');
    }

    async function onFavoriteMusic() {
      const folders = window.FavoriteService.getFolders();
      if (folders.length === 0) {
        showToast('请先创建收藏夹', 'error');
        return;
      }

      const result = state.result;
      if (!result) return;

      const itemId = 'music_' + Date.now();
      const prompt = state.prompt || '';

      window.FavoriteService.addToFolder(folders[0].id, {
        itemId,
        type: 'music',
        url: result.musicUrl,
        cover: result.coverUrl || '',
        prompt: prompt,
        title: '音乐 ' + new Date().toLocaleDateString(),
        duration: result.duration || 0,
      });

      showToast('已收藏到' + folders[0].name, 'success');
    }

    async function onFavoriteTTS() {
      const folders = window.FavoriteService.getFolders();
      if (folders.length === 0) {
        showToast('请先创建收藏夹', 'error');
        return;
      }

      const result = state.result;
      if (!result) return;

      const itemId = 'tts_' + Date.now();
      const input = document.getElementById('promptInput').value || '';

      window.FavoriteService.addToFolder(folders[0].id, {
        itemId,
        type: 'tts',
        url: result.filePath,
        prompt: input,
        title: '语音 ' + new Date().toLocaleDateString(),
      });

      showToast('已收藏到' + folders[0].name, 'success');
    }

    // Input listener
    document.getElementById('promptInput').addEventListener('input', function() {
      state.prompt = this.value;
      clearError();
    });

    // Template Panel Functions
    function openTemplatePanel() {
      loadTemplates();
      document.getElementById('templateOverlay').classList.add('active');
      document.getElementById('templatePanel').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeTemplatePanel() {
      document.getElementById('templateOverlay').classList.remove('active');
      document.getElementById('templatePanel').classList.remove('active');
      document.body.style.overflow = '';
    }

    // ==========================================
    // Offline Detection for Generate Page
    // ==========================================
    function checkNetworkAndDisableGenerate() {
      const btn = document.getElementById('generateBtn');
      const offlineTip = document.getElementById('offlineGenerateTip');
      if (!navigator.onLine) {
        btn.classList.add('disabled');
        btn.textContent = '当前离线，无法生成';
        btn.disabled = true;
        if (offlineTip) offlineTip.style.display = 'block';
      } else {
        btn.classList.remove('disabled');
        btn.textContent = state.batchMode ? '📦 批量生成' : '🚀 开始生成';
        btn.disabled = false;
        if (offlineTip) offlineTip.style.display = 'none';
      }
    }

    // Add offline tip element after form card
    (function insertOfflineTip() {
      const formCard = document.querySelector('.form-card');
      if (formCard && !document.getElementById('offlineGenerateTip')) {
        const tip = document.createElement('div');
        tip.id = 'offlineGenerateTip';
        tip.style.cssText = 'display:none;background:#fff3cd;border:1px solid #ffc107;border-radius:6px;padding:10px 12px;font-size:13px;color:#856404;margin-bottom:12px;text-align:center;';
        tip.textContent = '📡 当前处于离线状态，无法生成新内容';
        formCard.parentNode.insertBefore(tip, formCard.nextSibling);
      }
    })();

    // Listen for online/offline events on this page
    window.addEventListener('online', checkNetworkAndDisableGenerate);
    window.addEventListener('offline', checkNetworkAndDisableGenerate);

    // Initial check
    setTimeout(checkNetworkAndDisableGenerate, 100);

    async function loadTemplates() {
      const { loadTemplates } = await import('../services/templateService.js');
      const templates = loadTemplates(state.type);
      renderTemplateGrid(templates);
    }

    function renderTemplateGrid(templates) {
      const grid = document.getElementById('templateGrid');
      grid.innerHTML = templates.map(t => `
        <div class="template-card" onclick="applyTemplateById('${t.id}')">
          <div class="template-card-name">${t.name}</div>
          <div class="template-card-desc">${t.desc}</div>
          <div class="template-card-prompt">${t.prompt}</div>
        </div>
      `).join('');
    }

    async function applyTemplateById(templateId) {
      const { applyTemplate } = await import('../services/templateService.js');
      const result = applyTemplate(state.type, templateId);
      if (result) {
        document.getElementById('promptInput').value = result.prompt;
        state.prompt = result.prompt;

        // Apply params
        if (result.params) {
          if (state.type === 'image') {
            if (result.params.style) document.getElementById('styleSelect').value = result.params.style;
            if (result.params.size) document.getElementById('sizeSelect').value = result.params.size;
          } else if (state.type === 'music') {
            if (result.params.genre) document.getElementById('genreSelect').value = result.params.genre;
            if (result.params.duration) document.getElementById('durationSelect').value = result.params.duration;
          } else if (state.type === 'tts') {
            if (result.params.voice) document.getElementById('voiceSelect').value = result.params.voice;
          }
        }
        closeTemplatePanel();
        showToast('模板已应用，请修改占位符内容', 'success');
      }
    }
  </script>
